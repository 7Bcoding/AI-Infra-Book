<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc">
<title id="title">一次内积的累加过程</title><desc id="desc">三个乘积2、负2、3使累加器从0变为2、0、3。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="36.000" y="32.000" class="" text-anchor="start">按 j = 0、1、2 依次推进</text>
<text x="340.000" y="78.000" class="small" text-anchor="middle">j = 0</text>
<text x="340.000" y="120.000" class="" text-anchor="middle">1</text>
<text x="340.000" y="164.000" class="" text-anchor="middle">2</text>
<text x="340.000" y="208.000" class="" text-anchor="middle">2</text>
<text x="550.000" y="78.000" class="small" text-anchor="middle">j = 1</text>
<text x="550.000" y="120.000" class="" text-anchor="middle">2</text>
<text x="550.000" y="164.000" class="" text-anchor="middle">-1</text>
<text x="550.000" y="208.000" class="" text-anchor="middle">-2</text>
<text x="760.000" y="78.000" class="small" text-anchor="middle">j = 2</text>
<text x="760.000" y="120.000" class="" text-anchor="middle">3</text>
<text x="760.000" y="164.000" class="" text-anchor="middle">1</text>
<text x="760.000" y="208.000" class="" text-anchor="middle">3</text>
<text x="56.000" y="120.000" class="small" text-anchor="start">读取 a[j]</text>
<text x="56.000" y="164.000" class="small" text-anchor="start">读取 x[j]</text>
<text x="56.000" y="208.000" class="small" text-anchor="start">乘积</text>
<line x1="54.000" y1="91.000" x2="895.000" y2="91.000" stroke="#66727b" stroke-width="1.3"/>
<line x1="54.000" y1="226.000" x2="895.000" y2="226.000" stroke="#66727b" stroke-width="1.3"/>
<text x="56.000" y="289.000" class="small" text-anchor="start">累加器</text>
<circle cx="230.000" cy="280.000" r="25" fill="#dce7ed"/>
<text x="230.000" y="288.000" class="" text-anchor="middle">0</text>
<text x="230.000" y="334.000" class="math" text-anchor="middle">s0</text>
<line x1="265.000" y1="280.000" x2="405.000" y2="280.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="335.000" y="262.000" class="small" text-anchor="middle">加 2</text>
<circle cx="440.000" cy="280.000" r="25" fill="#dce7ed"/>
<text x="440.000" y="288.000" class="" text-anchor="middle">2</text>
<text x="440.000" y="334.000" class="math" text-anchor="middle">s1</text>
<line x1="475.000" y1="280.000" x2="615.000" y2="280.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="545.000" y="262.000" class="small" text-anchor="middle">加 −2</text>
<circle cx="650.000" cy="280.000" r="25" fill="#dce7ed"/>
<text x="650.000" y="288.000" class="" text-anchor="middle">0</text>
<text x="650.000" y="334.000" class="math" text-anchor="middle">s2</text>
<line x1="685.000" y1="280.000" x2="825.000" y2="280.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="755.000" y="262.000" class="small" text-anchor="middle">加 3</text>
<circle cx="860.000" cy="280.000" r="25" fill="#dce7ed"/>
<text x="860.000" y="288.000" class="" text-anchor="middle">3</text>
<text x="860.000" y="334.000" class="math" text-anchor="middle">s3</text>
</svg>