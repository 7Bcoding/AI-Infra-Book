<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">第一行输出的计算依赖</title><desc id="desc">三个乘积独立，归约、偏置、比较依次需要前面的值。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="35.000" y="31.000" class="" text-anchor="start">第一行：先有输入，后有结果</text>
<line x1="189.000" y1="100.000" x2="340.000" y2="167.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="189.000" y1="220.000" x2="340.000" y2="177.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="397.000" y1="172.000" x2="533.000" y2="220.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="189.000" y1="335.000" x2="533.000" y2="235.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="589.000" y1="225.000" x2="703.000" y2="225.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="761.000" y1="225.000" x2="871.000" y2="225.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<circle cx="160.000" cy="100.000" r="27" fill="#dce7ed"/>
<text x="160.000" y="108.000" class="" text-anchor="middle">2</text>
<text x="160.000" y="57.000" class="small" text-anchor="middle">1 × 2</text>
<circle cx="160.000" cy="220.000" r="27" fill="#dce7ed"/>
<text x="160.000" y="228.000" class="" text-anchor="middle">-2</text>
<text x="160.000" y="177.000" class="small" text-anchor="middle">2 × (−1)</text>
<circle cx="160.000" cy="335.000" r="27" fill="#dce7ed"/>
<text x="160.000" y="343.000" class="" text-anchor="middle">3</text>
<text x="160.000" y="292.000" class="small" text-anchor="middle">3 × 1</text>
<circle cx="368.000" cy="172.000" r="27" fill="#dce7ed"/>
<text x="368.000" y="180.000" class="" text-anchor="middle">0</text>
<text x="368.000" y="129.000" class="small" text-anchor="middle">前两项相加</text>
<circle cx="560.000" cy="225.000" r="27" fill="#dce7ed"/>
<text x="560.000" y="233.000" class="" text-anchor="middle">3</text>
<text x="560.000" y="182.000" class="small" text-anchor="middle">再加第三项</text>
<circle cx="732.000" cy="225.000" r="27" fill="#dce7ed"/>
<text x="732.000" y="233.000" class="" text-anchor="middle">-1</text>
<text x="732.000" y="182.000" class="small" text-anchor="middle">加偏置 −4</text>
<circle cx="900.000" cy="225.000" r="27" fill="#dce7ed"/>
<text x="900.000" y="233.000" class="" text-anchor="middle">0</text>
<text x="900.000" y="182.000" class="small" text-anchor="middle">与 0 取最大</text>
<text x="630.000" y="345.000" class="small" text-anchor="middle">最长链：乘法 → 加法 → 加法 → 偏置 → 比较</text>
</svg>