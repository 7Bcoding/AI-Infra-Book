<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
<title id="title">两个执行者的七步安排</title><desc id="desc">每个执行者独立处理一行，每个动作一单位，两行均在七单位后完成。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="35.000" y="32.000" class="" text-anchor="start">一个格子 = 一个动作 = 一个时间单位</text>
<text x="34.000" y="116.000" class="small" text-anchor="start">执行者 0</text>
<rect x="154.000" y="88.000" width="110.000" height="48.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="209.000" y="118.000" class="small" text-anchor="middle">乘 2</text>
<rect x="264.000" y="88.000" width="110.000" height="48.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="319.000" y="118.000" class="small" text-anchor="middle">乘 −2</text>
<rect x="374.000" y="88.000" width="110.000" height="48.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="429.000" y="118.000" class="small" text-anchor="middle">和 0</text>
<rect x="484.000" y="88.000" width="110.000" height="48.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="539.000" y="118.000" class="small" text-anchor="middle">乘 3</text>
<rect x="594.000" y="88.000" width="110.000" height="48.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="649.000" y="118.000" class="small" text-anchor="middle">和 3</text>
<rect x="704.000" y="88.000" width="110.000" height="48.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="759.000" y="118.000" class="small" text-anchor="middle">加成 −1</text>
<rect x="814.000" y="88.000" width="110.000" height="48.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="869.000" y="118.000" class="small" text-anchor="middle">输出 0</text>
<text x="34.000" y="205.000" class="small" text-anchor="start">执行者 1</text>
<rect x="154.000" y="177.000" width="110.000" height="48.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="209.000" y="207.000" class="small" text-anchor="middle">乘 8</text>
<rect x="264.000" y="177.000" width="110.000" height="48.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="319.000" y="207.000" class="small" text-anchor="middle">乘 −5</text>
<rect x="374.000" y="177.000" width="110.000" height="48.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="429.000" y="207.000" class="small" text-anchor="middle">和 3</text>
<rect x="484.000" y="177.000" width="110.000" height="48.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
