<rect x="594.000" y="177.000" width="110.000" height="48.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="649.000" y="207.000" class="small" text-anchor="middle">和 9</text>
<rect x="704.000" y="177.000" width="110.000" height="48.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="759.000" y="207.000" class="small" text-anchor="middle">加成 10</text>
<rect x="814.000" y="177.000" width="110.000" height="48.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
