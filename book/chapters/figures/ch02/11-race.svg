<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="435" viewBox="0 0 1000 435" role="img" aria-labelledby="title desc">
<title id="title">共享累加器的更新如何丢失</title><desc id="desc">两个参与者先读取0，分别写2和负2，最后加3得1。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="150.000" y="32.000" class="" text-anchor="middle">执行者 0</text>
<text x="500.000" y="32.000" class="" text-anchor="middle">共享 s</text>
<text x="850.000" y="32.000" class="" text-anchor="middle">执行者 1</text>
<line x1="150.000" y1="60.000" x2="150.000" y2="371.000" stroke="#ecedef" stroke-width="1.3"/>
<line x1="500.000" y1="60.000" x2="500.000" y2="371.000" stroke="#ecedef" stroke-width="1.3"/>
<line x1="850.000" y1="60.000" x2="850.000" y2="371.000" stroke="#ecedef" stroke-width="1.3"/>
<circle cx="500.000" cy="75.000" r="23" fill="#dce7ed"/>
<text x="500.000" y="83.000" class="" text-anchor="middle">0</text>
<line x1="472.000" y1="75.000" x2="180.000" y2="75.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="150.000" y="102.000" class="small" text-anchor="middle">读到 0</text>
<line x1="527.000" y1="129.000" x2="820.000" y2="129.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="850.000" y="156.000" class="small" text-anchor="middle">也读到 0</text>
<text x="150.000" y="196.000" class="small" text-anchor="middle">局部算出 0 + 2</text>
<line x1="185.000" y1="210.000" x2="472.000" y2="210.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<circle cx="500.000" cy="210.000" r="23" fill="#dce7ed"/>
<text x="500.000" y="218.000" class="" text-anchor="middle">2</text>
<text x="850.000" y="267.000" class="small" text-anchor="middle">仍用旧值算 0 − 2</text>
<line x1="815.000" y1="280.000" x2="528.000" y2="280.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<circle cx="500.000" cy="280.000" r="23" fill="#efe0d5"/>
<text x="500.000" y="288.000" class="" text-anchor="middle">−2</text>
<text x="335.000" y="313.000" class="small" text-anchor="middle" style="fill:#a45b3e">前一次更新被覆盖</text>
<line x1="500.000" y1="307.000" x2="500.000" y2="347.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<circle cx="500.000" cy="375.000" r="23" fill="#efe0d5"/>
<text x="500.000" y="383.000" class="" text-anchor="middle">1</text>
<text x="560.000" y="382.000" class="small" text-anchor="start">再加第三项 3</text>
<text x="150.000" y="417.000" class="small" text-anchor="start">依此交错：1；正确内积：3</text>
</svg>