<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">别名改写与独立复制</title><desc id="desc">左侧z和u共享同一存储，右侧先复制后修改保留原始z。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="45.000" y="34.000" class="" text-anchor="start">（a）u 与 z 指向同一个对象</text>
<text x="545.000" y="34.000" class="" text-anchor="start">（b）u 是独立副本</text>
<line x1="500.000" y1="58.000" x2="500.000" y2="332.000" stroke="#ecedef" stroke-width="1.3"/>
<text x="63.000" y="100.000" class="math" text-anchor="start">z</text>
<line x1="88.000" y1="94.000" x2="191.000" y2="110.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="63.000" y="158.000" class="math" text-anchor="start">u</text>
<line x1="88.000" y1="152.000" x2="191.000" y2="110.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="205.000" y="80.000" width="105.000" height="60.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="257.500" y="117.200" class="" text-anchor="middle">3</text>
<rect x="310.000" y="80.000" width="105.000" height="60.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="362.500" y="117.200" class="" text-anchor="middle">9</text>
<line x1="310.000" y1="149.000" x2="310.000" y2="205.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="330.000" y="184.000" class="small" text-anchor="start">原地写入</text>
<rect x="205.000" y="217.000" width="105.000" height="60.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="257.500" y="254.200" class="" text-anchor="middle">0</text>
<rect x="310.000" y="217.000" width="105.000" height="60.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="362.500" y="254.200" class="" text-anchor="middle">10</text>
<text x="250.000" y="322.000" class="small" text-anchor="middle" style="fill:#a45b3e">再读取 z：E = 100</text>
<text x="556.000" y="117.000" class="math" text-anchor="start">z</text>
<line x1="586.000" y1="110.000" x2="670.000" y2="110.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="685.000" y="80.000" width="105.000" height="60.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="737.500" y="117.200" class="" text-anchor="middle">3</text>
<rect x="790.000" y="80.000" width="105.000" height="60.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="842.500" y="117.200" class="" text-anchor="middle">9</text>
<text x="556.000" y="254.000" class="math" text-anchor="start">u</text>
<line x1="586.000" y1="247.000" x2="670.000" y2="247.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="685.000" y="217.000" width="105.000" height="60.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="737.500" y="254.200" class="" text-anchor="middle">0</text>
<rect x="790.000" y="217.000" width="105.000" height="60.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="842.500" y="254.200" class="" text-anchor="middle">10</text>
<text x="787.000" y="183.000" class="small" text-anchor="middle">复制后独立修改</text>
<text x="750.000" y="322.000" class="small" text-anchor="middle" style="fill:#38677f">原始 z 保留：E = 90</text>
</svg>