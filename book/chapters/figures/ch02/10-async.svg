<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc">
<title id="title">异步提交与结果可用</title><desc id="desc">CPU提交结束于0.1毫秒，GPU执行0.4到1.4毫秒，复制后1.6毫秒CPU可读。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="35.000" y="32.000" class="" text-anchor="start">调用返回之后，工作还在继续</text>
<text x="35.000" y="99.000" class="small" text-anchor="start">CPU</text>
<rect x="150.000" y="76.000" width="45.000" height="37.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="172.500" y="62.000" class="small" text-anchor="middle">提交</text>
<rect x="195.000" y="76.000" width="360.000" height="37.000" fill="#ecedef" stroke="#25333b" stroke-width="1"/>
<text x="375.000" y="101.000" class="small" text-anchor="middle">做不依赖结果的其他工作</text>
<text x="35.000" y="173.000" class="small" text-anchor="start">设备</text>
<rect x="195.000" y="150.000" width="135.000" height="37.000" fill="#ecedef" stroke="#25333b" stroke-width="1"/>
<text x="262.500" y="175.000" class="small" text-anchor="middle">等待</text>
<rect x="330.000" y="150.000" width="450.000" height="37.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="555.000" y="175.000" class="small" text-anchor="middle">实际执行：1.0 ms</text>
<text x="35.000" y="247.000" class="small" text-anchor="start">结果搬回</text>
<rect x="780.000" y="224.000" width="90.000" height="37.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="870.000" y="212.000" class="small" text-anchor="middle">CPU 可读</text>
<line x1="870.000" y1="218.000" x2="870.000" y2="274.000" stroke="#38677f" stroke-width="1.3" stroke-dasharray="5 5"/>
<line x1="150.000" y1="300.000" x2="960.000" y2="300.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="150.000" y1="293.000" x2="150.000" y2="307.000" stroke="#66727b" stroke-width="1.3"/>
<text x="150.000" y="328.000" class="small" text-anchor="middle">0</text>
<line x1="195.000" y1="293.000" x2="195.000" y2="307.000" stroke="#66727b" stroke-width="1.3"/>
<text x="195.000" y="351.000" class="small" text-anchor="middle">0.1</text>
<line x1="330.000" y1="293.000" x2="330.000" y2="307.000" stroke="#66727b" stroke-width="1.3"/>
<text x="330.000" y="328.000" class="small" text-anchor="middle">0.4</text>
<line x1="780.000" y1="293.000" x2="780.000" y2="307.000" stroke="#66727b" stroke-width="1.3"/>
<text x="780.000" y="328.000" class="small" text-anchor="middle">1.4</text>
<line x1="870.000" y1="293.000" x2="870.000" y2="307.000" stroke="#66727b" stroke-width="1.3"/>
<text x="870.000" y="351.000" class="small" text-anchor="middle">1.6</text>
<text x="975.000" y="328.000" class="small" text-anchor="end">ms</text>
</svg>