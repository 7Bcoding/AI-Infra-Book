<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">事件发生时间与特征可用时间</title><desc id="desc">事件发生时间与特征可用时间；数值与章节教学例一致。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="45.000" y="35.000" class="" text-anchor="start">重建 10:03 的模型输入</text>
<line x1="130.000" y1="370.000" x2="130.000" y2="378.000" stroke="#66727b" stroke-width="1.3"/>
<text x="130.000" y="402.000" class="small" text-anchor="middle" style="fill:#25333b">09:58</text>
<line x1="205.000" y1="370.000" x2="205.000" y2="378.000" stroke="#66727b" stroke-width="1.3"/>
<text x="205.000" y="431.000" class="small" text-anchor="middle" style="fill:#25333b">09:59</text>
<line x1="280.000" y1="370.000" x2="280.000" y2="378.000" stroke="#66727b" stroke-width="1.3"/>
<text x="280.000" y="402.000" class="small" text-anchor="middle" style="fill:#25333b">10:00</text>
<line x1="505.000" y1="370.000" x2="505.000" y2="378.000" stroke="#66727b" stroke-width="1.3"/>
<text x="505.000" y="402.000" class="small" text-anchor="middle" style="fill:#25333b">10:03</text>
<line x1="655.000" y1="370.000" x2="655.000" y2="378.000" stroke="#66727b" stroke-width="1.3"/>
<text x="655.000" y="402.000" class="small" text-anchor="middle" style="fill:#25333b">10:05</text>
<line x1="805.000" y1="370.000" x2="805.000" y2="378.000" stroke="#66727b" stroke-width="1.3"/>
<text x="805.000" y="402.000" class="small" text-anchor="middle" style="fill:#25333b">10:07</text>
<line x1="130.000" y1="370.000" x2="880.000" y2="370.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="505.000" y1="65.000" x2="505.000" y2="370.000" stroke="#a45b3e" stroke-width="1.6" stroke-dasharray="5 5"/>
<text x="505.000" y="55.000" class="small" text-anchor="middle" style="fill:#a45b3e">预测时刻</text>
<line x1="130.000" y1="125.000" x2="205.000" y2="125.000" stroke="#38677f" stroke-width="3"/>
<circle cx="130.000" cy="125.000" r="4" fill="#38677f"/>
<circle cx="205.000" cy="125.000" r="4" fill="#38677f"/>
<text x="130.000" y="99.000" class="small" text-anchor="start">旧值 2：事件</text>
<text x="217.000" y="149.000" class="small" text-anchor="start">可查询</text>
<line x1="280.000" y1="220.000" x2="805.000" y2="220.000" stroke="#a45b3e" stroke-width="3"/>
<circle cx="280.000" cy="220.000" r="4" fill="#a45b3e"/>
<circle cx="805.000" cy="220.000" r="4" fill="#a45b3e"/>
<text x="280.000" y="194.000" class="small" text-anchor="start">新值 3：事件</text>
<text x="805.000" y="248.000" class="small" text-anchor="middle">才可查询</text>
<circle cx="655.000" cy="315.000" r="5" fill="#38677f"/>
<text x="667.000" y="322.000" class="small" text-anchor="start">标签确定</text>
<text x="85.000" y="487.000" class="small" text-anchor="start">10:03 能读到旧值 2；新值虽来自 10:00 的事件，仍不可用。</text>
</svg>
