<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="356" viewBox="0 0 1000 356" role="img" aria-labelledby="title desc">
<title id="title">图 16-1</title><desc id="desc">四种布局的长期存储按权重、梯度与优化器三类画在同一 GiB 刻度下。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="55.000" y="90.000" class="" text-anchor="start">完整复制</text>
<rect x="221.000" y="65.000" width="82.000" height="33.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<rect x="303.000" y="65.000" width="82.000" height="33.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<rect x="385.000" y="65.000" width="492.000" height="33.000" fill="#b1c6cd" stroke="#aeb9bf" stroke-width="1"/>
<text x="887.000" y="89.000" class="small" text-anchor="start">8 GiB</text>
<text x="55.000" y="149.000" class="" text-anchor="start">分优化器</text>
<rect x="221.000" y="124.000" width="82.000" height="33.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<rect x="303.000" y="124.000" width="82.000" height="33.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<rect x="385.000" y="124.000" width="123.000" height="33.000" fill="#b1c6cd" stroke="#aeb9bf" stroke-width="1"/>
<text x="518.000" y="148.000" class="small" text-anchor="start">3.5 GiB</text>
<text x="55.000" y="208.000" class="" text-anchor="start">再分梯度</text>
<rect x="221.000" y="183.000" width="82.000" height="33.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<rect x="303.000" y="183.000" width="20.500" height="33.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<rect x="323.500" y="183.000" width="123.000" height="33.000" fill="#b1c6cd" stroke="#aeb9bf" stroke-width="1"/>
<text x="456.500" y="207.000" class="small" text-anchor="start">2.75 GiB</text>
<text x="55.000" y="267.000" class="" text-anchor="start">再分权重</text>
<rect x="221.000" y="242.000" width="20.500" height="33.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<rect x="241.500" y="242.000" width="20.500" height="33.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<rect x="262.000" y="242.000" width="123.000" height="33.000" fill="#b1c6cd" stroke="#aeb9bf" stroke-width="1"/>
<text x="395.000" y="266.000" class="small" text-anchor="start">2 GiB</text>
<line x1="713.000" y1="51.000" x2="713.000" y2="281.000" stroke="#a45b3e" stroke-width="1.8" stroke-dasharray="5 5"/>
<text x="713.000" y="36.000" class="small" text-anchor="middle" style="fill:#25333b">6 GiB 上限</text>
<text x="500.000" y="324.000" class="small" text-anchor="middle" style="fill:#25333b">每条从左往右为低精度权重、梯度、主权重与 Adam 两个矩。</text>
</svg>
