<line x1="680.000" y1="105.000" x2="405.000" y2="105.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="541.000" y="74.000" class="small" text-anchor="middle" style="fill:#25333b">TP：分特征</text>
