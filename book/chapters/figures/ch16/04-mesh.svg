<rect x="212.000" y="211.000" width="656.000" height="82.000" fill="none" stroke="#aeb9bf" stroke-width="1"/>
<rect x="285.000" y="228.000" width="102.000" height="46.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
