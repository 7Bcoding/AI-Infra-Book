<line x1="766.000" y1="63.000" x2="766.000" y2="238.000" stroke="#aeb9bf" stroke-width="1" stroke-dasharray="5 5"/>
<text x="766.000" y="265.000" class="small" text-anchor="middle" style="fill:#25333b">8</text>
<line x1="915.000" y1="63.000" x2="915.000" y2="238.000" stroke="#aeb9bf" stroke-width="1" stroke-dasharray="5 5"/>
<text x="915.000" y="265.000" class="small" text-anchor="middle" style="fill:#25333b">10</text>
