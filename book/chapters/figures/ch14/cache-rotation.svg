<line x1="361.459" y1="274.000" x2="473.380" y2="274.000" stroke="#a45b3e" stroke-width="2.5"/>
<rect x="447.387" y="270.000" width="8.000" height="8.000" fill="#a45b3e" stroke="#a45b3e" stroke-width="1"/>
