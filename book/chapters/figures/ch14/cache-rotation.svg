<line x1="641.000" y1="60.000" x2="641.000" y2="298.000" stroke="#ecedef" stroke-width="1.5"/>
<text x="641.000" y="326.000" class="small" text-anchor="middle">1</text>
<line x1="834.000" y1="60.000" x2="834.000" y2="298.000" stroke="#ecedef" stroke-width="1.5"/>
<text x="834.000" y="326.000" class="small" text-anchor="middle">2</text>
<text x="222.000" y="94.000" class="" text-anchor="end">单表，改用四行</text>
<line x1="701.438" y1="80.000" x2="869.415" y2="80.000" stroke="#38677f" stroke-width="2.5"/>
<circle cx="760.858" cy="80.000" r="5" fill="#38677f"/>
<line x1="824.282" y1="94.000" x2="877.550" y2="94.000" stroke="#a45b3e" stroke-width="2.5"/>
