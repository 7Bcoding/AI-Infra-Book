<rect x="849.575" y="150.000" width="8.000" height="8.000" fill="#a45b3e" stroke="#a45b3e" stroke-width="1"/>
<text x="222.000" y="214.000" class="" text-anchor="end">一行，改用轮换</text>
<line x1="368.320" y1="200.000" x2="700.145" y2="200.000" stroke="#38677f" stroke-width="2.5"/>
