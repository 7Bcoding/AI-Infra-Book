<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="407" viewBox="0 0 1000 407" role="img" aria-labelledby="title desc">
<title id="title">工作项行数与权重工作集的实测对照</title><desc id="desc">配对差值以零为界，正值表示节省时间。四行版的两个对照全部为正，轮换权重表的两个对照均跨零。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="255.000" y="38.000" class="" text-anchor="start">同轮主机等待时间的差值（毫秒）</text>
<line x1="255.000" y1="60.000" x2="255.000" y2="298.000" stroke="#ecedef" stroke-width="1.5"/>
<text x="255.000" y="326.000" class="small" text-anchor="middle">-1</text>
<line x1="448.000" y1="60.000" x2="448.000" y2="298.000" stroke="#66727b" stroke-width="1.5"/>
