<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="343" viewBox="0 0 1000 343" role="img" aria-labelledby="title desc">
<title id="title">同一个梯度的三条支路</title><desc id="desc">以损失为起点，ReLU 的掩码送到偏置归约和矩阵乘的两条转置乘法，列出实际梯度。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="500.000" y="35.000" class="" text-anchor="middle" style="fill:#25333b">损失为所有输出之和，ReLU 留下的梯度 G</text>
<rect x="438.000" y="53.000" width="62.000" height="37.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="469.000" y="78.500" class="" text-anchor="middle" style="fill:#25333b">0</text>
<rect x="500.000" y="53.000" width="62.000" height="37.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="531.000" y="78.500" class="" text-anchor="middle" style="fill:#25333b">1</text>
<rect x="438.000" y="90.000" width="62.000" height="37.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="469.000" y="115.500" class="" text-anchor="middle" style="fill:#25333b">1</text>
<rect x="500.000" y="90.000" width="62.000" height="37.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="531.000" y="115.500" class="" text-anchor="middle" style="fill:#25333b">1</text>
<line x1="500.000" y1="136.000" x2="186.000" y2="183.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="120.000" y="193.000" width="64.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="152.000" y="220.000" class="" text-anchor="middle" style="fill:#25333b">-1</text>
<rect x="184.000" y="193.000" width="64.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="216.000" y="220.000" class="" text-anchor="middle" style="fill:#25333b">3</text>
<rect x="120.000" y="233.000" width="64.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="152.000" y="260.000" class="" text-anchor="middle" style="fill:#25333b">1</text>
<rect x="184.000" y="233.000" width="64.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="216.000" y="260.000" class="" text-anchor="middle" style="fill:#25333b">4</text>
<text x="185.000" y="313.000" class="small" text-anchor="middle" style="fill:#25333b">G Wᵀ → 输入梯度</text>
<line x1="500.000" y1="136.000" x2="503.000" y2="183.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="437.000" y="193.000" width="64.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="469.000" y="220.000" class="" text-anchor="middle" style="fill:#25333b">3</text>
<rect x="501.000" y="193.000" width="64.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="533.000" y="220.000" class="" text-anchor="middle" style="fill:#25333b">4</text>
<rect x="437.000" y="233.000" width="64.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="469.000" y="260.000" class="" text-anchor="middle" style="fill:#25333b">4</text>
<rect x="501.000" y="233.000" width="64.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="533.000" y="260.000" class="" text-anchor="middle" style="fill:#25333b">6</text>
<text x="502.000" y="313.000" class="small" text-anchor="middle" style="fill:#25333b">Xᵀ G → 权重梯度</text>
<line x1="500.000" y1="136.000" x2="819.000" y2="183.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="753.000" y="193.000" width="64.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="785.000" y="220.000" class="" text-anchor="middle" style="fill:#25333b">1</text>
<rect x="817.000" y="193.000" width="64.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="849.000" y="220.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<text x="818.000" y="313.000" class="small" text-anchor="middle" style="fill:#25333b">沿行求和 → 偏置梯度</text>
</svg>
