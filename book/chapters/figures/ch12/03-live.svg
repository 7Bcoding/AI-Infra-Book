<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">一次训练步的存活区间</title><desc id="desc">输入、权重、激活和梯度的使用区间，从前向延伸到对应反向的最后一次读取。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="204.000" y="45.000" class="small" text-anchor="middle" style="fill:#25333b">投影</text>
<line x1="204.000" y1="65.000" x2="204.000" y2="293.000" stroke="#aeb9bf" stroke-width="0.75" stroke-dasharray="5 5"/>
<text x="337.000" y="45.000" class="small" text-anchor="middle" style="fill:#25333b">加偏置</text>
<line x1="337.000" y1="65.000" x2="337.000" y2="293.000" stroke="#aeb9bf" stroke-width="0.75" stroke-dasharray="5 5"/>
<text x="470.000" y="45.000" class="small" text-anchor="middle" style="fill:#25333b">ReLU</text>
<line x1="470.000" y1="65.000" x2="470.000" y2="293.000" stroke="#aeb9bf" stroke-width="0.75" stroke-dasharray="5 5"/>
<text x="603.000" y="45.000" class="small" text-anchor="middle" style="fill:#25333b">损失</text>
<line x1="603.000" y1="65.000" x2="603.000" y2="293.000" stroke="#aeb9bf" stroke-width="0.75" stroke-dasharray="5 5"/>
<text x="736.000" y="45.000" class="small" text-anchor="middle" style="fill:#25333b">ReLU 反向</text>
<line x1="736.000" y1="65.000" x2="736.000" y2="293.000" stroke="#aeb9bf" stroke-width="0.75" stroke-dasharray="5 5"/>
<text x="869.000" y="45.000" class="small" text-anchor="middle" style="fill:#25333b">投影反向</text>
<line x1="869.000" y1="65.000" x2="869.000" y2="293.000" stroke="#aeb9bf" stroke-width="0.75" stroke-dasharray="5 5"/>
<text x="42.000" y="87.000" class="small" text-anchor="start">输入 X</text>
<line x1="204.000" y1="80.000" x2="869.000" y2="80.000" stroke="#38677f" stroke-width="5"/>
<circle cx="204.000" cy="80.000" r="5" fill="#25333b"/>
<circle cx="869.000" cy="80.000" r="5" fill="#25333b"/>
<text x="42.000" y="121.000" class="small" text-anchor="start">权重 W</text>
<line x1="204.000" y1="114.000" x2="869.000" y2="114.000" stroke="#38677f" stroke-width="5"/>
<circle cx="204.000" cy="114.000" r="5" fill="#25333b"/>
<circle cx="869.000" cy="114.000" r="5" fill="#25333b"/>
<text x="42.000" y="155.000" class="small" text-anchor="start">乘积 P</text>
<line x1="204.000" y1="148.000" x2="337.000" y2="148.000" stroke="#a45b3e" stroke-width="5"/>
<circle cx="204.000" cy="148.000" r="5" fill="#25333b"/>
<circle cx="337.000" cy="148.000" r="5" fill="#25333b"/>
<text x="42.000" y="189.000" class="small" text-anchor="start">加偏置 Z</text>
<line x1="337.000" y1="182.000" x2="470.000" y2="182.000" stroke="#a45b3e" stroke-width="5"/>
<circle cx="337.000" cy="182.000" r="5" fill="#25333b"/>
<circle cx="470.000" cy="182.000" r="5" fill="#25333b"/>
<text x="42.000" y="223.000" class="small" text-anchor="start">激活 Y</text>
<line x1="470.000" y1="216.000" x2="736.000" y2="216.000" stroke="#a45b3e" stroke-width="5"/>
<circle cx="470.000" cy="216.000" r="5" fill="#25333b"/>
<circle cx="736.000" cy="216.000" r="5" fill="#25333b"/>
<text x="42.000" y="257.000" class="small" text-anchor="start">掩后梯度 G</text>
<line x1="736.000" y1="250.000" x2="869.000" y2="250.000" stroke="#a45b3e" stroke-width="5"/>
<circle cx="736.000" cy="250.000" r="5" fill="#25333b"/>
<circle cx="869.000" cy="250.000" r="5" fill="#25333b"/>
<text x="500.000" y="340.000" class="small" text-anchor="middle" style="fill:#25333b">简化到本次导数所需的读取；用户持有的输出或下一步还用的参数可以活得更久。</text>
</svg>
