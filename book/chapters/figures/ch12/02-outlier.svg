<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="343" viewBox="0 0 1000 343" role="img" aria-labelledby="title desc">
<title id="title">逐表与逐列量化</title><desc id="desc">同一权重在整表共用尺度和按列选尺度时的解码值，以及对应的第一列输出。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="173.000" y="43.000" class="" text-anchor="middle" style="fill:#25333b">原权重</text>
<rect x="90.000" y="70.000" width="83.000" height="53.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="131.500" y="103.500" class="" text-anchor="middle" style="fill:#25333b">2</text>
<rect x="173.000" y="70.000" width="83.000" height="53.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="214.500" y="103.500" class="" text-anchor="middle" style="fill:#25333b">-1</text>
<rect x="90.000" y="123.000" width="83.000" height="53.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="131.500" y="156.500" class="" text-anchor="middle" style="fill:#25333b">1</text>
<rect x="173.000" y="123.000" width="83.000" height="53.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="214.500" y="156.500" class="" text-anchor="middle" style="fill:#25333b">12</text>
<line x1="132.000" y1="182.000" x2="132.000" y2="213.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="173.000" y="251.000" class="" text-anchor="middle" style="fill:#25333b">(4, 10)</text>
<text x="495.000" y="43.000" class="" text-anchor="middle" style="fill:#25333b">共用尺度 4</text>
<rect x="412.000" y="70.000" width="83.000" height="53.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="453.500" y="103.500" class="" text-anchor="middle" style="fill:#25333b">0</text>
<rect x="495.000" y="70.000" width="83.000" height="53.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="536.500" y="103.500" class="" text-anchor="middle" style="fill:#25333b">0</text>
<rect x="412.000" y="123.000" width="83.000" height="53.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="453.500" y="156.500" class="" text-anchor="middle" style="fill:#25333b">0</text>
<rect x="495.000" y="123.000" width="83.000" height="53.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="536.500" y="156.500" class="" text-anchor="middle" style="fill:#25333b">12</text>
<line x1="454.000" y1="182.000" x2="454.000" y2="213.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="495.000" y="251.000" class="" text-anchor="middle" style="fill:#25333b">(0, 0)</text>
<text x="817.000" y="43.000" class="" text-anchor="middle" style="fill:#25333b">两列各取尺度</text>
<rect x="734.000" y="70.000" width="83.000" height="53.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="775.500" y="103.500" class="" text-anchor="middle" style="fill:#25333b">2</text>
<rect x="817.000" y="70.000" width="83.000" height="53.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="858.500" y="103.500" class="" text-anchor="middle" style="fill:#25333b">0</text>
<rect x="734.000" y="123.000" width="83.000" height="53.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="775.500" y="156.500" class="" text-anchor="middle" style="fill:#25333b">4/3</text>
<rect x="817.000" y="123.000" width="83.000" height="53.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="858.500" y="156.500" class="" text-anchor="middle" style="fill:#25333b">12</text>
<line x1="776.000" y1="182.000" x2="776.000" y2="213.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="817.000" y="251.000" class="" text-anchor="middle" style="fill:#25333b">(14/3, 34/3)</text>
<text x="500.000" y="312.000" class="small" text-anchor="middle" style="fill:#25333b">底行仅列出输出第一列的两个分量；每列都乘同一个 X。</text>
</svg>
