<text x="645.000" y="100.500" class="" text-anchor="middle" style="fill:#25333b">乙</text>
<rect x="758.000" y="72.000" width="124.000" height="43.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="820.000" y="100.500" class="" text-anchor="middle" style="fill:#25333b">乙</text>
