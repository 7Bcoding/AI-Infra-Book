<rect x="812.250" y="78.000" width="82.031" height="31.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="20.000" y="203.000" class="small" text-anchor="start">存储 → 主机</text>
<line x1="156.000" y1="193.000" x2="894.281" y2="193.000" stroke="#aeb9bf" stroke-width="0.8"/>
<rect x="156.000" y="178.000" width="328.125" height="31.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<rect x="484.125" y="178.000" width="328.125" height="31.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="20.000" y="262.000" class="small" text-anchor="start">主机 → GPU</text>
<line x1="156.000" y1="252.000" x2="894.281" y2="252.000" stroke="#aeb9bf" stroke-width="0.8"/>
<rect x="484.125" y="237.000" width="41.016" height="31.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<rect x="812.250" y="237.000" width="41.016" height="31.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<line x1="156.000" y1="54.000" x2="156.000" y2="276.000" stroke="#66727b" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="156.000" y="311.000" class="small" text-anchor="middle" style="fill:#25333b">0</text>
<line x1="484.125" y1="54.000" x2="484.125" y2="276.000" stroke="#66727b" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="484.125" y="311.000" class="small" text-anchor="middle" style="fill:#25333b">31.25</text>
<line x1="812.250" y1="54.000" x2="812.250" y2="276.000" stroke="#66727b" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="812.250" y="311.000" class="small" text-anchor="middle" style="fill:#25333b">62.5</text>
<line x1="894.281" y1="54.000" x2="894.281" y2="276.000" stroke="#66727b" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="894.281" y="311.000" class="small" text-anchor="middle" style="fill:#25333b">70.31</text>
<text x="853.266" y="222.000" class="small" text-anchor="middle" style="fill:#25333b">66.41</text>
<text x="490.000" y="362.000" class="small" text-anchor="middle" style="fill:#25333b">时间（ms）。下两行的第二段主机读取在前一块送往 GPU 时已开始。</text>
