<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="306" viewBox="0 0 1000 306" role="img" aria-labelledby="title desc">
<title id="title">两种容量留下多少历史空间</title><desc id="desc">相同的权重与工作区使显存和可用 KV 空间具有不同的增长比例。</desc>
