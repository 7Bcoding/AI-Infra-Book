<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="361" viewBox="0 0 1000 361" role="img" aria-labelledby="title desc">
<title id="title">同一个权重参与四行的乘加</title><desc id="desc">固定一个权重为 2。左侧四个工作项各读一次，右侧一个工作项读一次，依次把 2、0、负 2、4 加到四行。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="243.000" y="40.000" class="" text-anchor="middle" style="fill:#25333b">每个工作项算一行</text>
<text x="756.000" y="40.000" class="" text-anchor="middle" style="fill:#25333b">一个工作项算四行</text>
<line x1="497.000" y1="22.000" x2="497.000" y2="310.000" stroke="#aeb9bf" stroke-width="1.3"/>
<text x="107.000" y="82.000" class="small" text-anchor="middle" style="fill:#25333b">工作项</text>
<text x="249.000" y="82.000" class="small" text-anchor="middle" style="fill:#25333b">读权重</text>
<text x="398.000" y="82.000" class="small" text-anchor="middle" style="fill:#25333b">加到本行</text>
<text x="594.000" y="82.000" class="small" text-anchor="middle" style="fill:#25333b">读权重</text>
<text x="797.000" y="82.000" class="small" text-anchor="middle" style="fill:#25333b">分别加到四行</text>
<rect x="550.000" y="164.000" width="88.000" height="45.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="594.000" y="193.500" class="" text-anchor="middle" style="fill:#25333b">2</text>
<line x1="638.000" y1="187.000" x2="672.000" y2="187.000" stroke="#66727b" stroke-width="1.3"/>
<line x1="672.000" y1="120.000" x2="672.000" y2="261.000" stroke="#66727b" stroke-width="1.3"/>
<text x="107.000" y="126.000" class="" text-anchor="middle" style="fill:#25333b">0</text>
<rect x="206.000" y="101.000" width="86.000" height="38.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="249.000" y="127.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<line x1="298.000" y1="120.000" x2="342.000" y2="120.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="398.000" y="126.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<line x1="672.000" y1="120.000" x2="704.000" y2="120.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="826.000" y="126.000" class="" text-anchor="middle" style="fill:#25333b">第 0 行　1 × 2 = 2</text>
<text x="107.000" y="173.000" class="" text-anchor="middle" style="fill:#25333b">1</text>
<rect x="206.000" y="148.000" width="86.000" height="38.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="249.000" y="174.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<line x1="298.000" y1="167.000" x2="342.000" y2="167.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="398.000" y="173.000" class="" text-anchor="middle" style="fill:#25333b">0</text>
<line x1="672.000" y1="167.000" x2="704.000" y2="167.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="826.000" y="173.000" class="" text-anchor="middle" style="fill:#25333b">第 1 行　0 × 2 = 0</text>
<text x="107.000" y="220.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<rect x="206.000" y="195.000" width="86.000" height="38.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="249.000" y="221.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<line x1="298.000" y1="214.000" x2="342.000" y2="214.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="398.000" y="220.000" class="" text-anchor="middle" style="fill:#25333b">-2</text>
<line x1="672.000" y1="214.000" x2="704.000" y2="214.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="826.000" y="220.000" class="" text-anchor="middle" style="fill:#25333b">第 2 行　-1 × 2 = -2</text>
<text x="107.000" y="267.000" class="" text-anchor="middle" style="fill:#25333b">3</text>
<rect x="206.000" y="242.000" width="86.000" height="38.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="249.000" y="268.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<line x1="298.000" y1="261.000" x2="342.000" y2="261.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="398.000" y="267.000" class="" text-anchor="middle" style="fill:#25333b">4</text>
<line x1="672.000" y1="261.000" x2="704.000" y2="261.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="826.000" y="267.000" class="" text-anchor="middle" style="fill:#25333b">第 3 行　2 × 2 = 4</text>
<text x="495.000" y="337.000" class="small" text-anchor="middle" style="fill:#25333b">固定同一列和同一个归约位置；四行依次提供 1、0、−1、2。</text>
</svg>
