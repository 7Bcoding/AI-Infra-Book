<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="308" viewBox="0 0 1000 308" role="img" aria-labelledby="title desc">
<title id="title">同一投影的跨块复用</title><desc id="desc">两条等比例的流量条对照跨块复用，权重均为 32 MiB、输出均为 1 MiB，输入由 32 MiB 缩至 1 MiB。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="38.000" y="113.000" class="small" text-anchor="start">不跨块复用</text>
<rect x="180.000" y="85.000" width="352.000" height="40.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="356.000" y="112.000" class="small" text-anchor="middle" style="fill:#25333b">X　32 MiB</text>
<rect x="532.000" y="85.000" width="352.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="708.000" y="112.000" class="small" text-anchor="middle" style="fill:#25333b">W　32 MiB</text>
<rect x="884.000" y="85.000" width="11.000" height="40.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<line x1="889.500" y1="82.000" x2="889.500" y2="72.000" stroke="#66727b" stroke-width="1.3"/>
<text x="889.500" y="65.000" class="small" text-anchor="middle" style="fill:#25333b">Y　1</text>
<text x="905.000" y="112.000" class="small" text-anchor="start">65</text>
<text x="38.000" y="203.000" class="small" text-anchor="start">X 在片上复用</text>
<rect x="180.000" y="175.000" width="11.000" height="40.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<line x1="185.500" y1="172.000" x2="185.500" y2="162.000" stroke="#66727b" stroke-width="1.3"/>
<text x="185.500" y="155.000" class="small" text-anchor="middle" style="fill:#25333b">X　1</text>
<rect x="191.000" y="175.000" width="352.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="367.000" y="202.000" class="small" text-anchor="middle" style="fill:#25333b">W　32 MiB</text>
<rect x="543.000" y="175.000" width="11.000" height="40.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<line x1="548.500" y1="172.000" x2="548.500" y2="162.000" stroke="#66727b" stroke-width="1.3"/>
<text x="548.500" y="155.000" class="small" text-anchor="middle" style="fill:#25333b">Y　1</text>
<text x="564.000" y="202.000" class="small" text-anchor="start">34</text>
<text x="500.000" y="278.000" class="small" text-anchor="middle" style="fill:#25333b">每个输出块都请求整份 X；32 个块的 W 列区间互不重叠。</text>
</svg>
