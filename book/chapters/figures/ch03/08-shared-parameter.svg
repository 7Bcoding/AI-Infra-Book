<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">共享参数的两条求导路径</title><desc id="desc">w同时用于W00和v0，初始值1，两条路径各贡献负0.5。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="35.000" y="32.000" class="" text-anchor="start">W₀₀ 与 v₀ 被约束为同一个 w</text>
<line x1="134.000" y1="219.000" x2="318.000" y2="119.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="210.000" y="140.000" class="small" text-anchor="middle">乘 x₀ = 1</text>
<line x1="140.000" y1="235.000" x2="518.000" y2="235.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="330.000" y="259.000" class="small" text-anchor="middle">直接用作乘数</text>
<line x1="384.000" y1="118.000" x2="529.000" y2="210.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="591.000" y1="235.000" x2="703.000" y2="235.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="649.000" y="212.000" class="small" text-anchor="middle">减 1</text>
<line x1="771.000" y1="235.000" x2="880.000" y2="235.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="825.000" y="210.000" class="small" text-anchor="middle">概率与损失</text>
<circle cx="105.000" cy="235.000" r="29" fill="#dce7ed"/>
<text x="105.000" y="242.000" class="" text-anchor="middle">1</text>
<text x="105.000" y="188.000" class="small" text-anchor="middle">w</text>
<circle cx="350.000" cy="100.000" r="29" fill="#dce7ed"/>
<text x="350.000" y="107.000" class="" text-anchor="middle">1</text>
<text x="350.000" y="53.000" class="small" text-anchor="middle">h₀ = w</text>
<circle cx="555.000" cy="235.000" r="29" fill="#dce7ed"/>
<text x="555.000" y="242.000" class="" text-anchor="middle">1</text>
<text x="555.000" y="188.000" class="small" text-anchor="middle">w × h₀</text>
<circle cx="738.000" cy="235.000" r="29" fill="#dce7ed"/>
<text x="738.000" y="242.000" class="" text-anchor="middle">0</text>
<text x="738.000" y="188.000" class="small" text-anchor="middle">z</text>
<circle cx="915.000" cy="235.000" r="29" fill="#dce7ed"/>
<text x="915.000" y="242.000" class="" text-anchor="middle">ln 2</text>
<text x="915.000" y="188.000" class="small" text-anchor="middle">ℓ</text>
<text x="300.000" y="338.000" class="small" text-anchor="middle" style="fill:#38677f">经隐藏值返回：−0.5</text>
<text x="710.000" y="338.000" class="small" text-anchor="middle" style="fill:#a45b3e">经输出乘数返回：−0.5</text>
<text x="500.000" y="397.000" class="" text-anchor="middle">同一个参数的总梯度：−0.5 + (−0.5) = −1</text>
</svg>