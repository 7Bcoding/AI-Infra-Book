<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">雅可比的列怎样汇总上游梯度</title><desc id="desc">三输出两输入的局部运算，每个输入梯度等于对应雅可比列与上游梯度的内积。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="350.000" y="38.000" class="" text-anchor="middle">局部雅可比 J：3 行 × 2 列</text>
<text x="765.000" y="38.000" class="" text-anchor="middle">三个输出的上游梯度</text>
<rect x="230.000" y="76.000" width="120.000" height="75.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="290.000" y="121.000" class="math" text-anchor="middle">J₀₀</text>
<rect x="350.000" y="76.000" width="120.000" height="75.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="410.000" y="121.000" class="math" text-anchor="middle">J₀₁</text>
<rect x="710.000" y="76.000" width="110.000" height="75.000" fill="#ecedef" stroke="#25333b" stroke-width="1"/>
<text x="765.000" y="121.000" class="math" text-anchor="middle">g₀</text>
<line x1="490.000" y1="112.000" x2="690.000" y2="112.000" stroke="#66727b" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="230.000" y="151.000" width="120.000" height="75.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="290.000" y="196.000" class="math" text-anchor="middle">J₁₀</text>
<rect x="350.000" y="151.000" width="120.000" height="75.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="410.000" y="196.000" class="math" text-anchor="middle">J₁₁</text>
<rect x="710.000" y="151.000" width="110.000" height="75.000" fill="#ecedef" stroke="#25333b" stroke-width="1"/>
<text x="765.000" y="196.000" class="math" text-anchor="middle">g₁</text>
<line x1="490.000" y1="187.000" x2="690.000" y2="187.000" stroke="#66727b" stroke-width="1.3" stroke-dasharray="5 5"/>
<rect x="230.000" y="226.000" width="120.000" height="75.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="290.000" y="271.000" class="math" text-anchor="middle">J₂₀</text>
<rect x="350.000" y="226.000" width="120.000" height="75.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="410.000" y="271.000" class="math" text-anchor="middle">J₂₁</text>
<rect x="710.000" y="226.000" width="110.000" height="75.000" fill="#ecedef" stroke="#25333b" stroke-width="1"/>
<text x="765.000" y="271.000" class="math" text-anchor="middle">g₂</text>
<line x1="490.000" y1="262.000" x2="690.000" y2="262.000" stroke="#66727b" stroke-width="1.3" stroke-dasharray="5 5"/>
<text x="350.000" y="333.000" class="small" text-anchor="middle">每一列对应一个输入</text>
<text x="765.000" y="333.000" class="small" text-anchor="middle">每一项对应一个输出</text>
<text x="170.000" y="390.000" class="" text-anchor="start" style="fill:#38677f">输入 0 的梯度 = J₀₀·g₀ + J₁₀·g₁ + J₂₀·g₂</text>
<text x="170.000" y="438.000" class="" text-anchor="start" style="fill:#a45b3e">输入 1 的梯度 = J₀₁·g₀ + J₁₁·g₁ + J₂₁·g₂</text>
</svg>