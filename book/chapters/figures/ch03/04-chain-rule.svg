<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="385" viewBox="0 0 1000 385" role="img" aria-labelledby="title desc">
<title id="title">沿局部导数传回梯度</title><desc id="desc">最终损失的梯度从1出发，乘负2得到概率梯度，再乘四分之一得到分数梯度。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="35.000" y="34.000" class="" text-anchor="start">前向数值</text>
<circle cx="170.000" cy="115.000" r="29" fill="#dce7ed"/>
<text x="170.000" y="122.000" class="" text-anchor="middle">0</text>
<text x="170.000" y="68.000" class="small" text-anchor="middle">z</text>
<circle cx="500.000" cy="115.000" r="29" fill="#dce7ed"/>
<text x="500.000" y="122.000" class="" text-anchor="middle">0.5</text>
<text x="500.000" y="68.000" class="small" text-anchor="middle">p</text>
<circle cx="830.000" cy="115.000" r="29" fill="#dce7ed"/>
<text x="830.000" y="122.000" class="" text-anchor="middle">ln 2</text>
<text x="830.000" y="68.000" class="small" text-anchor="middle">ℓ</text>
<line x1="205.000" y1="115.000" x2="462.000" y2="115.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="537.000" y1="115.000" x2="792.000" y2="115.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="335.000" y="94.000" class="small" text-anchor="middle">sigmoid</text>
<text x="665.000" y="94.000" class="small" text-anchor="middle">负对数</text>
<line x1="35.000" y1="173.000" x2="965.000" y2="173.000" stroke="#ecedef" stroke-width="1.3"/>
<text x="35.000" y="212.000" class="" text-anchor="start">反向梯度</text>
<circle cx="170.000" cy="285.000" r="35" fill="#efe0d5"/>
<text x="170.000" y="292.000" class="" text-anchor="middle">−0.5</text>
<circle cx="500.000" cy="285.000" r="35" fill="#efe0d5"/>
<text x="500.000" y="292.000" class="" text-anchor="middle">−2</text>
<circle cx="830.000" cy="285.000" r="35" fill="#efe0d5"/>
<text x="830.000" y="292.000" class="" text-anchor="middle">1</text>
<line x1="790.000" y1="285.000" x2="541.000" y2="285.000" stroke="#a45b3e" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="460.000" y1="285.000" x2="211.000" y2="285.000" stroke="#a45b3e" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="665.000" y="263.000" class="small" text-anchor="middle">乘局部导数 −2</text>
<text x="335.000" y="263.000" class="small" text-anchor="middle">乘局部导数 1/4</text>
<text x="170.000" y="355.000" class="small" text-anchor="middle">损失对 z 的变化率</text>
<text x="500.000" y="355.000" class="small" text-anchor="middle">损失对 p 的变化率</text>
<text x="830.000" y="355.000" class="small" text-anchor="middle">损失对自身的导数</text>
</svg>