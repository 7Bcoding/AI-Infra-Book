<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
<title id="title">训练中输入与激活的最后使用</title><desc id="desc">前向产生的隐藏值和ReLU状态必须保留或重算，直到对应反向完成。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="252.000" y="38.000" class="small" text-anchor="middle">隐藏层前向</text>
<text x="396.000" y="38.000" class="small" text-anchor="middle">输出与损失</text>
<text x="540.000" y="38.000" class="small" text-anchor="middle">输出层反向</text>
<text x="684.000" y="38.000" class="small" text-anchor="middle">隐藏层反向</text>
<text x="828.000" y="38.000" class="small" text-anchor="middle">参数更新</text>
<line x1="180.000" y1="60.000" x2="180.000" y2="500.000" stroke="#ecedef" stroke-width="1.3"/>
<line x1="324.000" y1="60.000" x2="324.000" y2="500.000" stroke="#ecedef" stroke-width="1.3"/>
<line x1="468.000" y1="60.000" x2="468.000" y2="500.000" stroke="#ecedef" stroke-width="1.3"/>
<line x1="612.000" y1="60.000" x2="612.000" y2="500.000" stroke="#ecedef" stroke-width="1.3"/>
<line x1="756.000" y1="60.000" x2="756.000" y2="500.000" stroke="#ecedef" stroke-width="1.3"/>
<line x1="900.000" y1="60.000" x2="900.000" y2="500.000" stroke="#ecedef" stroke-width="1.3"/>
<text x="35.000" y="103.000" class="small" text-anchor="start">输入 x</text>
<rect x="180.000" y="80.000" width="576.000" height="31.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="35.000" y="172.000" class="small" text-anchor="start">隐藏值 h</text>
<rect x="324.000" y="149.000" width="288.000" height="31.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="35.000" y="241.000" class="small" text-anchor="start">ReLU 状态</text>
<rect x="324.000" y="218.000" width="432.000" height="31.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="35.000" y="310.000" class="small" text-anchor="start">旧参数</text>
<rect x="180.000" y="287.000" width="720.000" height="31.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="35.000" y="379.000" class="small" text-anchor="start">输出参数梯度</text>
<rect x="612.000" y="356.000" width="288.000" height="31.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="35.000" y="448.000" class="small" text-anchor="start">隐藏参数梯度</text>
<rect x="756.000" y="425.000" width="144.000" height="31.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<line x1="180.000" y1="520.000" x2="932.000" y2="520.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="500.000" y="554.000" class="small" text-anchor="middle">事件先后，不代表等长耗时；横条结束表示相应最后使用完成</text>
</svg>