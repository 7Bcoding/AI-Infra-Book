<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" role="img" aria-labelledby="title desc">
<title id="title">隐藏梯度与权重梯度的外积</title><desc id="desc">负0.5通过正负输出权重得到符号相反的两个隐藏梯度，再与输入相乘。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<circle cx="500.000" cy="70.000" r="35" fill="#efe0d5"/>
<text x="500.000" y="77.000" class="" text-anchor="middle">−0.5</text>
<text x="500.000" y="23.000" class="small" text-anchor="middle">输出梯度 δ</text>
<line x1="470.000" y1="93.000" x2="267.000" y2="177.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="530.000" y1="93.000" x2="733.000" y2="177.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="349.000" y="108.000" class="small" text-anchor="middle">乘 v₀ = 1</text>
<text x="651.000" y="108.000" class="small" text-anchor="middle">乘 v₁ = −1</text>
<circle cx="235.000" cy="190.000" r="34" fill="#efe0d5"/>
<text x="235.000" y="197.000" class="" text-anchor="middle">−0.5</text>
<circle cx="765.000" cy="190.000" r="34" fill="#efe0d5"/>
<text x="765.000" y="197.000" class="" text-anchor="middle">0.5</text>
<text x="235.000" y="249.000" class="small" text-anchor="middle">a₀ 的梯度</text>
<text x="765.000" y="249.000" class="small" text-anchor="middle">a₁ 的梯度</text>
<text x="500.000" y="249.000" class="small" text-anchor="middle">两处 ReLU 的局部导数均为 1</text>
<text x="440.000" y="319.000" class="small" text-anchor="middle">x₀ = 1</text>
<text x="600.000" y="319.000" class="small" text-anchor="middle">x₁ = 2</text>
<text x="310.000" y="379.000" class="" text-anchor="end">−0.5</text>
<rect x="360.000" y="338.000" width="160.000" height="85.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="440.000" y="389.000" class="" text-anchor="middle">−0.5</text>
<rect x="520.000" y="338.000" width="160.000" height="85.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="600.000" y="389.000" class="" text-anchor="middle">−1</text>
<text x="310.000" y="464.000" class="" text-anchor="end">0.5</text>
<rect x="360.000" y="423.000" width="160.000" height="85.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="440.000" y="474.000" class="" text-anchor="middle">0.5</text>
<rect x="520.000" y="423.000" width="160.000" height="85.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="600.000" y="474.000" class="" text-anchor="middle">1</text>
<text x="310.000" y="319.000" class="small" text-anchor="end">行梯度</text>
<text x="700.000" y="424.000" class="small" text-anchor="start">每格 = 行梯度 × 输入</text>
</svg>