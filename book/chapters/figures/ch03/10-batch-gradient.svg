<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img" aria-labelledby="title desc">
<title id="title">两条样本的梯度怎样合并</title><desc id="desc">每个权重梯度取两条样本贡献的平均，不是先更新再计算下一条。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="151.000" y="55.000" class="" text-anchor="middle">第一条：y = 1</text>
<rect x="55.000" y="103.000" width="96.000" height="78.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="103.000" y="150.580" class="" text-anchor="middle">−0.5</text>
<rect x="151.000" y="103.000" width="96.000" height="78.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="199.000" y="150.580" class="" text-anchor="middle">−1</text>
<rect x="55.000" y="181.000" width="96.000" height="78.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="103.000" y="228.580" class="" text-anchor="middle">0.5</text>
<rect x="151.000" y="181.000" width="96.000" height="78.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="199.000" y="228.580" class="" text-anchor="middle">1</text>
<text x="493.000" y="55.000" class="" text-anchor="middle">第二条：y = 0</text>
<rect x="397.000" y="103.000" width="96.000" height="78.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="445.000" y="150.580" class="" text-anchor="middle">1</text>
<rect x="493.000" y="103.000" width="96.000" height="78.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="541.000" y="150.580" class="" text-anchor="middle">1.5</text>
<rect x="397.000" y="181.000" width="96.000" height="78.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="445.000" y="228.580" class="" text-anchor="middle">−1</text>
<rect x="493.000" y="181.000" width="96.000" height="78.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="541.000" y="228.580" class="" text-anchor="middle">−1.5</text>
<text x="838.000" y="55.000" class="" text-anchor="middle">两条样本的均值</text>
<rect x="742.000" y="103.000" width="96.000" height="78.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="790.000" y="150.580" class="" text-anchor="middle">0.25</text>
<rect x="838.000" y="103.000" width="96.000" height="78.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="886.000" y="150.580" class="" text-anchor="middle">0.25</text>
<rect x="742.000" y="181.000" width="96.000" height="78.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="790.000" y="228.580" class="" text-anchor="middle">−0.25</text>
<rect x="838.000" y="181.000" width="96.000" height="78.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="886.000" y="228.580" class="" text-anchor="middle">−0.25</text>
<text x="321.000" y="192.000" class="" text-anchor="middle">+</text>
<line x1="615.000" y1="181.000" x2="716.000" y2="181.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="665.000" y="156.000" class="small" text-anchor="middle">相加后 ÷ 2</text>
<text x="500.000" y="319.000" class="" text-anchor="middle">两条贡献都在同一组初始参数下计算</text>
</svg>