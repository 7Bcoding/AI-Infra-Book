<text x="98.000" y="271.000" class="small" text-anchor="end">0.3</text>
<line x1="110.000" y1="170.000" x2="880.000" y2="170.000" stroke="#ecedef" stroke-width="1.3"/>
<text x="98.000" y="176.000" class="small" text-anchor="end">0.6</text>
<line x1="110.000" y1="75.000" x2="880.000" y2="75.000" stroke="#ecedef" stroke-width="1.3"/>
<text x="98.000" y="81.000" class="small" text-anchor="end">0.9</text>
<line x1="110.000" y1="360.000" x2="892.000" y2="360.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="110.000" y1="360.000" x2="110.000" y2="65.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="110.000" y="51.000" class="small" text-anchor="start">损失 ℓ</text>
<text x="894.000" y="389.000" class="small" text-anchor="start"></text>
<rect x="221.000" y="140.503" width="86.000" height="219.497" fill="#ecedef" stroke="#25333b" stroke-width="1"/>
<text x="264.000" y="126.503" class="small" text-anchor="middle">0.693147</text>
<rect x="328.800" y="250.588" width="86.000" height="109.412" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="371.800" y="236.588" class="small" text-anchor="middle">0.345513</text>
<rect x="575.200" y="260.800" width="86.000" height="99.200" fill="#ecedef" stroke="#25333b" stroke-width="1"/>
<text x="618.200" y="246.800" class="small" text-anchor="middle">0.313262</text>
<rect x="683.000" y="110.723" width="86.000" height="249.277" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="726.000" y="96.723" class="small" text-anchor="middle">0.787192</text>
<text x="317.900" y="397.000" class="small" text-anchor="middle">训练：(1, 2)，y = 1</text>
