<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">残差连接与梯度的两条路径</title><desc id="desc">输出h加F(h)，输入梯度是直接贡献与变换分支贡献之和。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="35.000" y="32.000" class="" text-anchor="start">前向：r = h + F(h)</text>
<line x1="195.000" y1="218.000" x2="476.000" y2="108.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="541.000" y1="109.000" x2="788.000" y2="214.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="198.000" y1="230.000" x2="785.000" y2="230.000" stroke="#38677f" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="495.000" y="211.000" class="small" text-anchor="middle" style="fill:#38677f">恒等路径</text>
<line x1="849.000" y1="230.000" x2="925.000" y2="230.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<circle cx="163.000" cy="230.000" r="29" fill="#dce7ed"/>
<text x="163.000" y="237.000" class="" text-anchor="middle">h</text>
<text x="163.000" y="183.000" class="small" text-anchor="middle">输入</text>
<circle cx="510.000" cy="95.000" r="32" fill="#efe0d5"/>
<text x="510.000" y="102.000" class="" text-anchor="middle">F</text>
<text x="510.000" y="48.000" class="small" text-anchor="middle">变换分支</text>
<circle cx="816.000" cy="230.000" r="29" fill="#ecedef"/>
<text x="816.000" y="237.000" class="" text-anchor="middle">+</text>
<text x="816.000" y="183.000" class="small" text-anchor="middle">相加</text>
<text x="944.000" y="237.000" class="math" text-anchor="start">r</text>
<line x1="35.000" y1="296.000" x2="965.000" y2="296.000" stroke="#ecedef" stroke-width="1.3"/>
<text x="500" y="342" text-anchor="middle">反向：输入梯度 = 直接返回的 g + 经变换返回的 <tspan class="math">J<tspan baseline-shift="sub" font-size="75%">F</tspan><tspan baseline-shift="super" font-size="75%">T</tspan> g</tspan></text>
<text x="500.000" y="382.000" class="small" text-anchor="middle">有直接路径，也仍需检查两项相加后的尺度与方向</text>
</svg>