<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img" aria-labelledby="title desc">
<title id="title">嵌入表分片的读取与梯度归约</title><desc id="desc">嵌入表分片的读取与梯度归约；数值与章节教学例一致。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="45.000" y="35.000" class="" text-anchor="start">前向：重复编号只读取一次，原位置仍保留</text>
<rect x="90.000" y="80.000" width="50.000" height="44.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="115.000" y="109.000" class="" text-anchor="middle" style="fill:#25333b">1</text>
<rect x="160.000" y="80.000" width="50.000" height="44.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="185.000" y="109.000" class="" text-anchor="middle" style="fill:#25333b">6</text>
<rect x="230.000" y="80.000" width="50.000" height="44.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="255.000" y="109.000" class="" text-anchor="middle" style="fill:#25333b">6</text>
<rect x="300.000" y="80.000" width="50.000" height="44.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="325.000" y="109.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<text x="90.000" y="153.000" class="small" text-anchor="start">甲的查询序列</text>
<line x1="390.000" y1="102.000" x2="650.000" y2="102.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="520.000" y="82.000" class="small" text-anchor="middle" style="fill:#25333b">编号 6：8 B</text>
<rect x="690.000" y="65.000" width="205.000" height="36.000" fill="#ecedef" stroke="#25333b" stroke-width="1"/>
<text x="704.000" y="90.000" class="small" text-anchor="start">行 4：128 个数</text>
<rect x="690.000" y="106.000" width="205.000" height="36.000" fill="#ecedef" stroke="#25333b" stroke-width="1"/>
<text x="704.000" y="131.000" class="small" text-anchor="start">行 5：128 个数</text>
<rect x="690.000" y="147.000" width="205.000" height="36.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="704.000" y="172.000" class="small" text-anchor="start">行 6：128 个数</text>
<rect x="690.000" y="188.000" width="205.000" height="36.000" fill="#ecedef" stroke="#25333b" stroke-width="1"/>
<text x="704.000" y="213.000" class="small" text-anchor="start">行 7：128 个数</text>
<text x="690.000" y="250.000" class="small" text-anchor="start">乙保存行 4 至 7</text>
<line x1="665.000" y1="204.000" x2="390.000" y2="204.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="520.000" y="232.000" class="small" text-anchor="middle" style="fill:#25333b">返回一行：256 B</text>
<text x="65.000" y="290.000" class="small" text-anchor="start">返回后，填回两个原位置；权重版本在本轮保持一致。</text>
<line x1="45.000" y1="320.000" x2="955.000" y2="320.000" stroke="#ecedef" stroke-width="1.3"/>
<text x="45.000" y="363.000" class="" text-anchor="start">反向：同一参数行收到两份贡献，必须求和</text>
<text x="105.000" y="419.000" class="" text-anchor="start">位置 1：(1, 2)</text>
<text x="105.000" y="472.000" class="" text-anchor="start">位置 2：(3, −1)</text>
<line x1="315.000" y1="410.000" x2="440.000" y2="440.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="315.000" y1="467.000" x2="440.000" y2="440.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="470.000" y="448.000" class="" text-anchor="start">(4, 1)</text>
<line x1="570.000" y1="440.000" x2="700.000" y2="440.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="720.000" y="448.000" class="" text-anchor="start">乙更新行 6</text>
<text x="65.000" y="527.000" class="small" text-anchor="start">只画前两维；其余 126 维按同一规则归约。</text>
</svg>
