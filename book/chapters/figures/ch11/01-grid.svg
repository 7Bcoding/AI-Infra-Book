<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img" aria-labelledby="title desc">
<title id="title">FP16 的两段数轴</title><desc id="desc">两段浮点数轴标出一附近与二千零四十八附近相邻格点及半格舍入。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<line x1="146.000" y1="77.000" x2="898.000" y2="77.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="223.000" y1="68.000" x2="223.000" y2="87.000" stroke="#38677f" stroke-width="2"/>
<text x="223.000" y="119.000" class="" text-anchor="middle" style="fill:#25333b">1</text>
<line x1="505.000" y1="68.000" x2="505.000" y2="87.000" stroke="#a45b3e" stroke-width="2"/>
<text x="505.000" y="119.000" class="" text-anchor="middle" style="fill:#25333b">1 + 2⁻¹¹</text>
<line x1="787.000" y1="68.000" x2="787.000" y2="87.000" stroke="#38677f" stroke-width="2"/>
<text x="787.000" y="119.000" class="" text-anchor="middle" style="fill:#25333b">1 + 2⁻¹⁰</text>
<line x1="500.000" y1="61.000" x2="230.000" y2="61.000" stroke="#a45b3e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="365.000" y="50.000" class="small" text-anchor="middle" style="fill:#25333b">中点取偶</text>
<line x1="146.000" y1="224.000" x2="898.000" y2="224.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="223.000" y1="215.000" x2="223.000" y2="234.000" stroke="#38677f" stroke-width="2"/>
<text x="223.000" y="266.000" class="" text-anchor="middle" style="fill:#25333b">2048</text>
<line x1="505.000" y1="215.000" x2="505.000" y2="234.000" stroke="#a45b3e" stroke-width="2"/>
<text x="505.000" y="266.000" class="" text-anchor="middle" style="fill:#25333b">2049</text>
<line x1="787.000" y1="215.000" x2="787.000" y2="234.000" stroke="#38677f" stroke-width="2"/>
<text x="787.000" y="266.000" class="" text-anchor="middle" style="fill:#25333b">2050</text>
<line x1="500.000" y1="208.000" x2="230.000" y2="208.000" stroke="#a45b3e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="365.000" y="197.000" class="small" text-anchor="middle" style="fill:#25333b">中点取偶</text>
<text x="500.000" y="329.000" class="small" text-anchor="middle" style="fill:#25333b">实线箭头显示舍入方向。两行使用不同放大倍数。</text>
</svg>
