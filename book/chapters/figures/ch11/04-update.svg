<circle cx="851.000" cy="257.430" r="6" fill="#25333b"/>
<text x="851.000" y="302.000" class="small" text-anchor="middle" style="fill:#25333b">4</text>
<text x="500.000" y="345.000" class="small" text-anchor="middle" style="fill:#25333b">蓝线：每步直接 FP16 写回　　斜线：高精度主副本　　实点：给前向的舍入值</text>
</svg>
