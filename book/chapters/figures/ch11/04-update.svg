<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="376" viewBox="0 0 1000 376" role="img" aria-labelledby="title desc">
<title id="title">四次更新的舍入</title><desc id="desc">四次更新中，直接写回 FP16 的权重和保留主副本的权重逐步分离，并标出低精度格点。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<line x1="155.000" y1="67.000" x2="915.000" y2="67.000" stroke="#aeb9bf" stroke-width="1" stroke-dasharray="5 5"/>
<text x="48.000" y="73.000" class="small" text-anchor="start">1</text>
<line x1="155.000" y1="162.215" x2="915.000" y2="162.215" stroke="#aeb9bf" stroke-width="1" stroke-dasharray="5 5"/>
<text x="48.000" y="168.215" class="small" text-anchor="start">舍入中点</text>
<line x1="155.000" y1="257.430" x2="915.000" y2="257.430" stroke="#aeb9bf" stroke-width="1" stroke-dasharray="5 5"/>
<text x="48.000" y="263.430" class="small" text-anchor="start">下一格</text>
<polyline points="195.000,67.000 359.000,67.000 523.000,67.000 687.000,67.000 851.000,67.000" fill="none" stroke="#38677f" stroke-width="2.8"/>
<polyline points="195.000,67.000 359.000,106.000 523.000,145.000 687.000,184.000 851.000,223.000" fill="none" stroke="#a45b3e" stroke-width="2.6"/>
<circle cx="195.000" cy="67.000" r="6" fill="#25333b"/>
<text x="195.000" y="302.000" class="small" text-anchor="middle" style="fill:#25333b">0</text>
<circle cx="359.000" cy="67.000" r="6" fill="#25333b"/>
<text x="359.000" y="302.000" class="small" text-anchor="middle" style="fill:#25333b">1</text>
