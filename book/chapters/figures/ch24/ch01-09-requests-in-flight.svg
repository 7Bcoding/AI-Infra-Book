<svg xmlns="http://www.w3.org/2000/svg" width="900" height="402" viewBox="0 0 900 402" role="img" aria-labelledby="title desc">
<title id="title">同一段时间里的请求数</title><desc id="desc">三条请求各自在系统中停留三、四、两秒。按秒计数的在途数之和也是九。</desc>
