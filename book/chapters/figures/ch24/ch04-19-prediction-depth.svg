<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
<title id="title">两个深度的训练标签</title><desc id="desc">从三份主监督读到另外两份未来监督。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="370.000" y="48.000" class="" text-anchor="middle" style="fill:#25333b">读到“我”</text>
<text x="591.000" y="48.000" class="" text-anchor="middle" style="fill:#25333b">读到“爱”</text>
<text x="812.000" y="48.000" class="" text-anchor="middle" style="fill:#25333b">读到“你”</text>
<text x="33.000" y="104.000" class="" text-anchor="start">主头预测</text>
<rect x="294.000" y="78.000" width="152.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="370.000" y="105.000" class="" text-anchor="middle" style="fill:#25333b">爱</text>
<rect x="515.000" y="78.000" width="152.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="591.000" y="105.000" class="" text-anchor="middle" style="fill:#25333b">你</text>
<rect x="736.000" y="78.000" width="152.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="812.000" y="105.000" class="" text-anchor="middle" style="fill:#25333b">结束</text>
<text x="33.000" y="169.000" class="" text-anchor="start">附加模块可读的下一词</text>
<rect x="294.000" y="143.000" width="152.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="370.000" y="170.000" class="" text-anchor="middle" style="fill:#25333b">爱</text>
<rect x="515.000" y="143.000" width="152.000" height="40.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="591.000" y="170.000" class="" text-anchor="middle" style="fill:#25333b">你</text>
<rect x="736.000" y="143.000" width="152.000" height="40.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="812.000" y="170.000" class="" text-anchor="middle" style="fill:#25333b">—</text>
<text x="33.000" y="234.000" class="" text-anchor="start">附加模块预测</text>
<rect x="294.000" y="208.000" width="152.000" height="40.000" fill="#f4f1eb" stroke="#aeb9bf" stroke-width="1"/>
<text x="370.000" y="235.000" class="" text-anchor="middle" style="fill:#25333b">你</text>
<rect x="515.000" y="208.000" width="152.000" height="40.000" fill="#f4f1eb" stroke="#aeb9bf" stroke-width="1"/>
<text x="591.000" y="235.000" class="" text-anchor="middle" style="fill:#25333b">结束</text>
<rect x="736.000" y="208.000" width="152.000" height="40.000" fill="#f4f1eb" stroke="#aeb9bf" stroke-width="1"/>
<text x="812.000" y="235.000" class="" text-anchor="middle" style="fill:#25333b">—</text>
</svg>
