<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc">
<title id="title">图 22-1</title><desc id="desc">两条词元按专家重排为四份任务，再按词元原始位置与相应门控权重合并。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="110.000" y="42.000" class="small" text-anchor="middle" style="fill:#25333b">词元与激活</text>
<text x="485.000" y="42.000" class="small" text-anchor="middle" style="fill:#25333b">专家收到的行</text>
<text x="883.000" y="42.000" class="small" text-anchor="middle" style="fill:#25333b">回到来源的输出</text>
<rect x="38.000" y="89.000" width="157.000" height="43.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="116.500" y="117.500" class="" text-anchor="middle" style="fill:#25333b">A (0, 6)</text>
<rect x="805.000" y="89.000" width="156.000" height="43.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="883.000" y="117.500" class="" text-anchor="middle" style="fill:#25333b">(1.5, 4.5)</text>
<rect x="38.000" y="241.000" width="157.000" height="43.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="116.500" y="269.500" class="" text-anchor="middle" style="fill:#25333b">B (4, 10)</text>
<rect x="805.000" y="241.000" width="156.000" height="43.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="883.000" y="269.500" class="" text-anchor="middle" style="fill:#25333b">(8.5, 5.5)</text>
<rect x="401.000" y="89.000" width="167.000" height="43.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="484.500" y="117.500" class="" text-anchor="middle" style="fill:#25333b">E₀　A、B</text>
<rect x="401.000" y="241.000" width="167.000" height="43.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="484.500" y="269.500" class="" text-anchor="middle" style="fill:#25333b">E₁　A、B</text>
<line x1="197.000" y1="110.000" x2="396.000" y2="110.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="197.000" y1="110.000" x2="396.000" y2="262.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="197.000" y1="262.000" x2="396.000" y2="110.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="197.000" y1="262.000" x2="396.000" y2="262.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="572.000" y1="110.000" x2="800.000" y2="110.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="572.000" y1="110.000" x2="800.000" y2="262.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="572.000" y1="262.000" x2="800.000" y2="110.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="572.000" y1="262.000" x2="800.000" y2="262.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="500.000" y="344.000" class="small" text-anchor="middle" style="fill:#25333b">A 的两条返回按 3/4、1/4 合并；B 的两条按 1/4、3/4 合并。</text>
