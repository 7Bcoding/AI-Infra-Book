<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="367" viewBox="0 0 1000 367" role="img" aria-labelledby="title desc">
<title id="title">重排前后的一条数据依赖</title><desc id="desc">行优先时先写出数值四，下一步才读取它；列优先时同一依赖指向更早的时刻。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="266.000" y="42.000" class="small" text-anchor="middle" style="fill:#25333b">第 1 步</text>
<text x="453.000" y="42.000" class="small" text-anchor="middle" style="fill:#25333b">第 2 步</text>
<text x="640.000" y="42.000" class="small" text-anchor="middle" style="fill:#25333b">第 3 步</text>
<text x="827.000" y="42.000" class="small" text-anchor="middle" style="fill:#25333b">第 4 步</text>
<text x="95.000" y="121.000" class="" text-anchor="middle" style="fill:#25333b">按行</text>
<rect x="198.000" y="87.000" width="136.000" height="48.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="266.000" y="118.000" class="" text-anchor="middle" style="fill:#25333b">(1, 0)</text>
<rect x="385.000" y="87.000" width="136.000" height="48.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="453.000" y="118.000" class="" text-anchor="middle" style="fill:#25333b">(1, 1)</text>
<rect x="572.000" y="87.000" width="136.000" height="48.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="640.000" y="118.000" class="" text-anchor="middle" style="fill:#25333b">(2, 0)</text>
<rect x="759.000" y="87.000" width="136.000" height="48.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="827.000" y="118.000" class="" text-anchor="middle" style="fill:#25333b">(2, 1)</text>
<polyline points="453.000,136.000 453.000,159.000 640.000,159.000" fill="none" stroke="#a45b3e" stroke-width="1.7"/>
<line x1="640.000" y1="159.000" x2="640.000" y2="137.000" stroke="#a45b3e" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="548.000" y="189.000" class="small" text-anchor="middle" style="fill:#a45b3e">先写 4，后读 4，得到 5</text>
<text x="95.000" y="273.000" class="" text-anchor="middle" style="fill:#25333b">按列</text>
<rect x="198.000" y="239.000" width="136.000" height="48.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="266.000" y="270.000" class="" text-anchor="middle" style="fill:#25333b">(1, 0)</text>
<rect x="385.000" y="239.000" width="136.000" height="48.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="453.000" y="270.000" class="" text-anchor="middle" style="fill:#25333b">(2, 0)</text>
<rect x="572.000" y="239.000" width="136.000" height="48.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="640.000" y="270.000" class="" text-anchor="middle" style="fill:#25333b">(1, 1)</text>
<rect x="759.000" y="239.000" width="136.000" height="48.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="827.000" y="270.000" class="" text-anchor="middle" style="fill:#25333b">(2, 1)</text>
<polyline points="640.000,288.000 640.000,311.000 453.000,311.000" fill="none" stroke="#a45b3e" stroke-width="1.7"/>
<line x1="453.000" y1="311.000" x2="453.000" y2="289.000" stroke="#a45b3e" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="548.000" y="341.000" class="small" text-anchor="middle" style="fill:#a45b3e">先读到旧值 0，得到 1；写 4 已晚</text>
<line x1="53.000" y1="212.000" x2="945.000" y2="212.000" stroke="#aeb9bf" stroke-width="1.3"/>
</svg>
