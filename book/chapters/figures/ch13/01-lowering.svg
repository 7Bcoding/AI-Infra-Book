<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="348" viewBox="0 0 1000 348" role="img" aria-labelledby="title desc">
<title id="title">一个输出格的三层表示</title><desc id="desc">同一输出格从算子图到循环到指令动作的对应关系，突出归约结束后才加偏置。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="63.000" y="66.000" class="" text-anchor="start">算子</text>
<text x="229.000" y="66.000" class="" text-anchor="start">矩阵乘　→　偏置加法　→　ReLU</text>
<line x1="63.000" y1="86.000" x2="926.000" y2="86.000" stroke="#aeb9bf" stroke-width="0.8"/>
<text x="63.000" y="159.000" class="" text-anchor="start">循环</text>
<text x="229.000" y="159.000" class="" text-anchor="start">k = 0，1 × (−1)　　k = 1，2 × 3</text>
<line x1="63.000" y1="179.000" x2="926.000" y2="179.000" stroke="#aeb9bf" stroke-width="0.8"/>
<text x="63.000" y="252.000" class="" text-anchor="start">执行</text>
<text x="229.000" y="252.000" class="" text-anchor="start">累加器 0 → −1 → 5　　加 1 → 6　　取正 → 6</text>
<line x1="63.000" y1="272.000" x2="926.000" y2="272.000" stroke="#aeb9bf" stroke-width="0.8"/>
<line x1="164.000" y1="83.000" x2="164.000" y2="122.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="164.000" y1="177.000" x2="164.000" y2="215.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="500.000" y="316.000" class="small" text-anchor="middle" style="fill:#25333b">固定同一输出 Y[0, 1]，追踪两项乘积的交付顺序。</text>
</svg>
