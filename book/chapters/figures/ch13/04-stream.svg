<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">跨流先后关系</title><desc id="desc">两个设备队列在事件处建立写后读依赖，记录最后使用的时刻延续到另一条流完成。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<line x1="192.000" y1="58.000" x2="192.000" y2="232.000" stroke="#aeb9bf" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="192.000" y="265.000" class="small" text-anchor="middle" style="fill:#25333b">0</text>
<line x1="344.000" y1="58.000" x2="344.000" y2="232.000" stroke="#aeb9bf" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="344.000" y="265.000" class="small" text-anchor="middle" style="fill:#25333b">2</text>
<line x1="496.000" y1="58.000" x2="496.000" y2="232.000" stroke="#aeb9bf" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="496.000" y="265.000" class="small" text-anchor="middle" style="fill:#25333b">4</text>
<line x1="648.000" y1="58.000" x2="648.000" y2="232.000" stroke="#aeb9bf" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="648.000" y="265.000" class="small" text-anchor="middle" style="fill:#25333b">6</text>
<line x1="724.000" y1="58.000" x2="724.000" y2="232.000" stroke="#aeb9bf" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="724.000" y="265.000" class="small" text-anchor="middle" style="fill:#25333b">7</text>
<line x1="800.000" y1="58.000" x2="800.000" y2="232.000" stroke="#aeb9bf" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="800.000" y="265.000" class="small" text-anchor="middle" style="fill:#25333b">8</text>
<line x1="952.000" y1="58.000" x2="952.000" y2="232.000" stroke="#aeb9bf" stroke-width="0.8" stroke-dasharray="5 5"/>
<text x="952.000" y="265.000" class="small" text-anchor="middle" style="fill:#25333b">10</text>
<text x="52.000" y="104.000" class="" text-anchor="start">流 A</text>
<rect x="192.000" y="74.000" width="456.000" height="44.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="420.000" y="103.000" class="" text-anchor="middle" style="fill:#25333b">生产 P</text>
<text x="52.000" y="203.000" class="" text-anchor="start">流 B</text>
<rect x="648.000" y="173.000" width="152.000" height="44.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="724.000" y="202.000" class="" text-anchor="middle" style="fill:#25333b">读取 P</text>
<rect x="648.000" y="74.000" width="304.000" height="44.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="800.000" y="103.000" class="" text-anchor="middle" style="fill:#25333b">A 的无关工作</text>
<line x1="648.000" y1="121.000" x2="648.000" y2="167.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="800.000" y1="286.000" x2="952.000" y2="286.000" stroke="#25333b" stroke-width="1.3"/>
<line x1="800.000" y1="281.000" x2="800.000" y2="291.000" stroke="#25333b" stroke-width="1.3"/>
<line x1="952.000" y1="281.000" x2="952.000" y2="291.000" stroke="#25333b" stroke-width="1.3"/>
<text x="876.000" y="312.000" class="small" text-anchor="middle" style="fill:#25333b">此后可覆写 P</text>
<text x="340.000" y="312.000" class="small" text-anchor="middle" style="fill:#25333b">时刻（教学单位）</text>
</svg>
