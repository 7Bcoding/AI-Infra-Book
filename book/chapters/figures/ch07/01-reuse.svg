<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="382" viewBox="0 0 1000 382" role="img" aria-labelledby="title desc">
<title id="title">沿一个输入值追踪复用</title><desc id="desc">第 7 章教材插图。沿一个输入值追踪复用。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="140.000" y="46.000" class="" text-anchor="middle" style="fill:#25333b">全局地址</text>
<text x="475.000" y="46.000" class="" text-anchor="middle" style="fill:#25333b">共享面板</text>
<text x="813.000" y="46.000" class="" text-anchor="middle" style="fill:#25333b">线程的累加器</text>
<rect x="90.000" y="139.000" width="100.000" height="62.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="140.000" y="177.000" class="" text-anchor="middle" style="fill:#25333b">1</text>
<line x1="200.000" y1="170.000" x2="378.000" y2="170.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="393.000" y="121.000" width="70.000" height="50.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="428.000" y="153.000" class="" text-anchor="middle" style="fill:#25333b">1</text>
<rect x="463.000" y="121.000" width="70.000" height="50.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="498.000" y="153.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<rect x="393.000" y="171.000" width="70.000" height="50.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="428.000" y="203.000" class="" text-anchor="middle" style="fill:#25333b">3</text>
<rect x="463.000" y="171.000" width="70.000" height="50.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="498.000" y="203.000" class="" text-anchor="middle" style="fill:#25333b">4</text>
<line x1="555.000" y1="170.000" x2="695.000" y2="105.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="715.000" y="80.000" width="200.000" height="50.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="815.000" y="112.000" class="" text-anchor="middle" style="fill:#25333b">1 × (2)</text>
<text x="815.000" y="162.000" class="small" text-anchor="middle" style="fill:#25333b">输出 (0, 0)</text>
<line x1="555.000" y1="170.000" x2="695.000" y2="249.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="715.000" y="224.000" width="200.000" height="50.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="815.000" y="256.000" class="" text-anchor="middle" style="fill:#25333b">1 × (-1)</text>
<text x="815.000" y="306.000" class="small" text-anchor="middle" style="fill:#25333b">输出 (0, 1)</text>
<text x="500.000" y="355.000" class="small" text-anchor="middle" style="fill:#25333b">只追踪 X 的左上元素，其他输入暂略。</text>
</svg>
