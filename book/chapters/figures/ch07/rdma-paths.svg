<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="373" viewBox="0 0 1000 373" role="img" aria-labelledby="title desc">
<title id="title">一块梯度跨过网络</title><desc id="desc">网络有效载荷不变，直接访问设备缓冲可以省去两端的主机暂存。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="105.000" y="44.000" class="" text-anchor="middle" style="fill:#25333b">甲 GPU</text>
<text x="306.000" y="44.000" class="" text-anchor="middle" style="fill:#25333b">甲网卡</text>
<text x="688.000" y="44.000" class="" text-anchor="middle" style="fill:#25333b">乙网卡</text>
<text x="899.000" y="44.000" class="" text-anchor="middle" style="fill:#25333b">乙 GPU</text>
<circle cx="105.000" cy="140.000" r="6" fill="#25333b"/>
<circle cx="306.000" cy="140.000" r="6" fill="#25333b"/>
<circle cx="688.000" cy="140.000" r="6" fill="#25333b"/>
<circle cx="899.000" cy="140.000" r="6" fill="#25333b"/>
<line x1="322.000" y1="140.000" x2="674.000" y2="140.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="499.000" y="127.000" class="small" text-anchor="middle" style="fill:#25333b">网络载荷 64 MiB</text>
<circle cx="105.000" cy="289.000" r="6" fill="#25333b"/>
<circle cx="306.000" cy="289.000" r="6" fill="#25333b"/>
<circle cx="688.000" cy="289.000" r="6" fill="#25333b"/>
<circle cx="899.000" cy="289.000" r="6" fill="#25333b"/>
<line x1="322.000" y1="289.000" x2="674.000" y2="289.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="499.000" y="276.000" class="small" text-anchor="middle" style="fill:#25333b">网络载荷 64 MiB</text>
<line x1="111.000" y1="137.000" x2="180.000" y2="102.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="229.000" y1="103.000" x2="298.000" y2="137.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="205.000" y="90.000" class="small" text-anchor="middle" style="fill:#25333b">主机暂存</text>
<line x1="115.000" y1="289.000" x2="296.000" y2="289.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="694.000" y1="137.000" x2="768.000" y2="102.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="817.000" y1="103.000" x2="891.000" y2="137.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="793.000" y="90.000" class="small" text-anchor="middle" style="fill:#25333b">主机暂存</text>
<line x1="698.000" y1="289.000" x2="889.000" y2="289.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="495.000" y="202.000" class="small" text-anchor="middle" style="fill:#25333b">暂存路径：两端的主机内存各多一次写入和一次读取</text>
<text x="495.000" y="343.000" class="small" text-anchor="middle" style="fill:#25333b">显存直达：网卡对已登记的设备缓冲执行 DMA</text>
</svg>
