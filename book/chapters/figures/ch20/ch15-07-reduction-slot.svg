<text x="257.000" y="187.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<line x1="283.000" y1="181.000" x2="381.000" y2="181.000" stroke="#aeb9bf" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="407.000" y="53.000" class="small" text-anchor="middle" style="fill:#25333b">C 送 5</text>
<text x="407.000" y="122.000" class="" text-anchor="middle" style="fill:#25333b">AC</text>
<text x="407.000" y="187.000" class="" text-anchor="middle" style="fill:#25333b">7</text>
<line x1="433.000" y1="181.000" x2="531.000" y2="181.000" stroke="#aeb9bf" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="557.000" y="53.000" class="small" text-anchor="middle" style="fill:#a45b3e">A 重发 2</text>
<text x="557.000" y="122.000" class="" text-anchor="middle" style="fill:#25333b">AC</text>
<text x="557.000" y="187.000" class="" text-anchor="middle" style="fill:#a45b3e">7</text>
<line x1="583.000" y1="181.000" x2="681.000" y2="181.000" stroke="#aeb9bf" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="707.000" y="53.000" class="small" text-anchor="middle" style="fill:#25333b">D 送 7</text>
<text x="707.000" y="122.000" class="" text-anchor="middle" style="fill:#25333b">ACD</text>
<text x="707.000" y="187.000" class="" text-anchor="middle" style="fill:#25333b">14</text>
<line x1="733.000" y1="181.000" x2="831.000" y2="181.000" stroke="#aeb9bf" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="857.000" y="53.000" class="small" text-anchor="middle" style="fill:#25333b">B 送 3</text>
<text x="857.000" y="122.000" class="" text-anchor="middle" style="fill:#25333b">ABCD</text>
<text x="857.000" y="187.000" class="" text-anchor="middle" style="fill:#25333b">17</text>
<line x1="28.000" y1="75.000" x2="955.000" y2="75.000" stroke="#aeb9bf" stroke-width="1.3"/>
<line x1="407.000" y1="212.000" x2="557.000" y2="212.000" stroke="#a45b3e" stroke-width="1.3"/>
<line x1="407.000" y1="207.000" x2="407.000" y2="217.000" stroke="#a45b3e" stroke-width="1.3"/>
<line x1="557.000" y1="207.000" x2="557.000" y2="217.000" stroke="#a45b3e" stroke-width="1.3"/>
<text x="482.000" y="238.000" class="small" text-anchor="middle" style="fill:#a45b3e">同一贡献只算一次</text>
