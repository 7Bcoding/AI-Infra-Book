<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="363" viewBox="0 0 1000 363" role="img" aria-labelledby="title desc">
<title id="title">候选历史的提交边界</title><desc id="desc">第二枚遭拒，仅第一枚的后续状态可以保留到正确前缀</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="320.000" y="37.000" class="small" text-anchor="middle" style="fill:#25333b">已有前缀</text>
<text x="482.000" y="37.000" class="small" text-anchor="middle" style="fill:#25333b">位置 1</text>
<text x="644.000" y="37.000" class="small" text-anchor="middle" style="fill:#25333b">位置 2</text>
<text x="806.000" y="37.000" class="small" text-anchor="middle" style="fill:#25333b">位置 3</text>
<text x="44.000" y="97.000" class="" text-anchor="start">候选路径</text>
<rect x="257.000" y="63.000" width="126.000" height="53.000" fill="#ecedef" stroke="#aeb9bf" stroke-width="1"/>
<text x="320.000" y="96.500" class="" text-anchor="middle" style="fill:#25333b">h</text>
<rect x="419.000" y="63.000" width="126.000" height="53.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="482.000" y="96.500" class="" text-anchor="middle" style="fill:#25333b">u</text>
<rect x="581.000" y="63.000" width="126.000" height="53.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="644.000" y="96.500" class="" text-anchor="middle" style="fill:#25333b">v</text>
<rect x="743.000" y="63.000" width="126.000" height="53.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="806.000" y="96.500" class="" text-anchor="middle" style="fill:#25333b">w</text>
<text x="44.000" y="180.000" class="" text-anchor="start">验证结果</text>
<rect x="257.000" y="146.000" width="126.000" height="53.000" fill="#ecedef" stroke="#aeb9bf" stroke-width="1"/>
<text x="320.000" y="179.500" class="" text-anchor="middle" style="fill:#25333b">h</text>
<rect x="419.000" y="146.000" width="126.000" height="53.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="482.000" y="179.500" class="" text-anchor="middle" style="fill:#25333b">接受 u</text>
<rect x="581.000" y="146.000" width="126.000" height="53.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="644.000" y="179.500" class="" text-anchor="middle" style="fill:#25333b">拒绝 v</text>
<rect x="743.000" y="146.000" width="126.000" height="53.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="806.000" y="179.500" class="" text-anchor="middle" style="fill:#25333b">作废</text>
<text x="44.000" y="263.000" class="" text-anchor="start">已提交历史</text>
<rect x="257.000" y="229.000" width="126.000" height="53.000" fill="#ecedef" stroke="#aeb9bf" stroke-width="1"/>
<text x="320.000" y="262.500" class="" text-anchor="middle" style="fill:#25333b">h</text>
<rect x="419.000" y="229.000" width="126.000" height="53.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="482.000" y="262.500" class="" text-anchor="middle" style="fill:#25333b">u</text>
<rect x="581.000" y="229.000" width="126.000" height="53.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="644.000" y="262.500" class="" text-anchor="middle" style="fill:#25333b">校正 v′</text>
<line x1="557.000" y1="127.000" x2="557.000" y2="287.000" stroke="#a45b3e" stroke-width="1.3" stroke-dasharray="5 5"/>
<text x="510.000" y="337.000" class="small" text-anchor="middle" style="fill:#25333b">以 v 为条件的下一位置已失效；下一轮以校正词 v′ 继续。</text>
</svg>
