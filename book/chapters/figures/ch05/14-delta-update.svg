<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">累加平均与纠错的区别</title><desc id="desc">旧关联第一键值二，第二键值四，第一键的新值为六。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="500.000" y="35.000" class="" text-anchor="middle">旧状态 S = (2, 4)ᵀ；新键 k = (1, 0)，新值 v = 6</text>
<text x="175.000" y="101.000" class="small" text-anchor="middle">直接累加</text>
<text x="500.000" y="101.000" class="small" text-anchor="middle">累加后按次数平均</text>
<text x="825.000" y="101.000" class="small" text-anchor="middle">Delta 纠错，β = 1</text>
<text x="175.000" y="175.000" class="small" text-anchor="middle">2 + 6 = 8</text>
<text x="175.000" y="250.000" class="small" text-anchor="middle">S = (8, 4)ᵀ</text>
<text x="175.000" y="335.000" class="small" text-anchor="middle">读取第一键：8</text>
<line x1="175.000" y1="191.000" x2="175.000" y2="220.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="175.000" y1="268.000" x2="175.000" y2="303.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="500.000" y="175.000" class="small" text-anchor="middle">同样先得到 (8, 4)ᵀ</text>
<text x="500.000" y="250.000" class="small" text-anchor="middle">次数 z = (2, 1)</text>
<text x="500.000" y="335.000" class="small" text-anchor="middle">读取第一键：8 / 2 = 4</text>
<line x1="500.000" y1="191.000" x2="500.000" y2="220.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="500.000" y1="268.000" x2="500.000" y2="303.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="825.000" y="175.000" class="small" text-anchor="middle">先预测：kS = 2</text>
<text x="825.000" y="250.000" class="small" text-anchor="middle">只写差值：6 − 2 = 4</text>
<text x="825.000" y="335.000" class="small" text-anchor="middle">读取第一键：6</text>
<line x1="825.000" y1="191.000" x2="825.000" y2="220.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="825.000" y1="268.000" x2="825.000" y2="303.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="500.000" y="417.000" class="small" text-anchor="middle">若任务要求最新值，目标是 6；第二个正交方向在三种规则中均可读出 4</text>
</svg>