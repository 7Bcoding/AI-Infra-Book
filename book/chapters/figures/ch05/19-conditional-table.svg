<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">哈希查表与词元历史</title><desc id="desc">三个相邻词对分别指向同一张学习参数表中的零、三、零号行。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="234.000" y="56.000" class="" text-anchor="middle" style="fill:#25333b">(1, 3)</text>
<text x="234.000" y="103.000" class="small" text-anchor="middle" style="fill:#25333b">地址 0</text>
<text x="513.000" y="56.000" class="" text-anchor="middle" style="fill:#25333b">(3, 2)</text>
<text x="513.000" y="103.000" class="small" text-anchor="middle" style="fill:#25333b">地址 3</text>
<text x="790.000" y="56.000" class="" text-anchor="middle" style="fill:#25333b">(2, 1)</text>
<text x="790.000" y="103.000" class="small" text-anchor="middle" style="fill:#25333b">地址 0</text>
<line x1="234.000" y1="118.000" x2="274.000" y2="211.000" stroke="#a45b3e" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="513.000" y1="118.000" x2="684.000" y2="211.000" stroke="#38677f" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="790.000" y1="118.000" x2="274.000" y2="211.000" stroke="#a45b3e" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="210.000" y="222.000" width="123.000" height="53.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="271.500" y="255.500" class="" text-anchor="middle" style="fill:#25333b">表行 0</text>
<rect x="347.000" y="222.000" width="123.000" height="53.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="408.500" y="255.500" class="" text-anchor="middle" style="fill:#25333b">表行 1</text>
<rect x="484.000" y="222.000" width="123.000" height="53.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="545.500" y="255.500" class="" text-anchor="middle" style="fill:#25333b">表行 2</text>
<rect x="621.000" y="222.000" width="123.000" height="53.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="682.500" y="255.500" class="" text-anchor="middle" style="fill:#25333b">表行 3</text>
<rect x="758.000" y="222.000" width="123.000" height="53.000" fill="#ffffff" stroke="#aeb9bf" stroke-width="1"/>
<text x="819.500" y="255.500" class="" text-anchor="middle" style="fill:#25333b">表行 4</text>
<text x="501.000" y="321.000" class="small" text-anchor="middle" style="fill:#25333b">两次访问同一表行，可以复用读取，不能反推出完整的词对。</text>
</svg>
