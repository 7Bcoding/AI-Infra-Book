<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc">
<title id="title">两种等价的值聚合次序</title><desc id="desc">上方先展开三行值，下方先汇总潜在表示，两者输出相同。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="48.000" y="35.000" class="" text-anchor="start">同一组权重：(2/5, 1/5, 2/5)；第 0 头</text>
<text x="185.000" y="89.000" class="small" text-anchor="middle">先展开每一行 V</text>
<rect x="120.000" y="111.000" width="65.000" height="45.000" fill="#efe0d5" stroke="#b6c0c6" stroke-width="1"/>
<text x="152.500" y="140.500" class="" text-anchor="middle">2</text>
<rect x="185.000" y="111.000" width="65.000" height="45.000" fill="#efe0d5" stroke="#b6c0c6" stroke-width="1"/>
<text x="217.500" y="140.500" class="" text-anchor="middle">0</text>
<rect x="120.000" y="156.000" width="65.000" height="45.000" fill="#efe0d5" stroke="#b6c0c6" stroke-width="1"/>
<text x="152.500" y="185.500" class="" text-anchor="middle">0</text>
<rect x="185.000" y="156.000" width="65.000" height="45.000" fill="#efe0d5" stroke="#b6c0c6" stroke-width="1"/>
<text x="217.500" y="185.500" class="" text-anchor="middle">4</text>
<rect x="120.000" y="201.000" width="65.000" height="45.000" fill="#efe0d5" stroke="#b6c0c6" stroke-width="1"/>
<text x="152.500" y="230.500" class="" text-anchor="middle">2</text>
<rect x="185.000" y="201.000" width="65.000" height="45.000" fill="#efe0d5" stroke="#b6c0c6" stroke-width="1"/>
<text x="217.500" y="230.500" class="" text-anchor="middle">4</text>
<line x1="277.000" y1="180.000" x2="490.000" y2="180.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="380.000" y="161.000" class="small" text-anchor="middle">按位置加权求和</text>
<text x="650.000" y="188.000" class="" text-anchor="middle">(1.6, 2.4)</text>
<line x1="45.000" y1="278.000" x2="955.000" y2="278.000" stroke="#ecedef" stroke-width="1.3"/>
<text x="185.000" y="332.000" class="small" text-anchor="middle">先在 C 中加权</text>
<text x="185.000" y="390.000" class="" text-anchor="middle">(4/5, 3/5)</text>
<line x1="294.000" y1="382.000" x2="490.000" y2="382.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="385.000" y="360.000" class="small" text-anchor="middle">只对结果乘 Uᵥ</text>
<text x="650.000" y="390.000" class="" text-anchor="middle">(1.6, 2.4)</text>
<text x="850.000" y="181.000" class="small" text-anchor="middle">相同</text>
<line x1="850.000" y1="204.000" x2="850.000" y2="351.000" stroke="#66727b" stroke-width="1.3" stroke-dasharray="5 5"/>
<text x="850.000" y="390.000" class="small" text-anchor="middle">相同</text>
<text x="500.000" y="479.000" class="small" text-anchor="middle">固定线性变换可以移到求和外面；每个头仍用自己的权重</text>
</svg>