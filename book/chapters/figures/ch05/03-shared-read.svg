<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">同一份KV得到不同的两组读取</title><desc id="desc">两个查询方向给三个位置不同权重，最终分别得到1.6 2.4与1.2 3.2。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="110.000" y="44.000" class="small" text-anchor="middle">位置</text>
<text x="285.000" y="44.000" class="small" text-anchor="middle">共享 K</text>
<text x="475.000" y="44.000" class="small" text-anchor="middle">共享 V</text>
<text x="680.000" y="44.000" class="small" text-anchor="middle">查询头 0 的权重</text>
<text x="870.000" y="44.000" class="small" text-anchor="middle">查询头 1 的权重</text>
<text x="110.000" y="115.000" class="" text-anchor="middle">0</text>
<rect x="220.000" y="79.000" width="130.000" height="58.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="285.000" y="115.000" class="" text-anchor="middle">(1, 0)</text>
<rect x="410.000" y="79.000" width="130.000" height="58.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="475.000" y="115.000" class="" text-anchor="middle">(2, 0)</text>
<text x="680.000" y="115.000" class="" text-anchor="middle">2/5</text>
<text x="870.000" y="115.000" class="" text-anchor="middle">1/5</text>
<text x="110.000" y="195.000" class="" text-anchor="middle">1</text>
<rect x="220.000" y="159.000" width="130.000" height="58.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="285.000" y="195.000" class="" text-anchor="middle">(0, 1)</text>
<rect x="410.000" y="159.000" width="130.000" height="58.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="475.000" y="195.000" class="" text-anchor="middle">(0, 4)</text>
<text x="680.000" y="195.000" class="" text-anchor="middle">1/5</text>
<text x="870.000" y="195.000" class="" text-anchor="middle">2/5</text>
<text x="110.000" y="275.000" class="" text-anchor="middle">2</text>
<rect x="220.000" y="239.000" width="130.000" height="58.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="285.000" y="275.000" class="" text-anchor="middle">(1, 1)</text>
<rect x="410.000" y="239.000" width="130.000" height="58.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="475.000" y="275.000" class="" text-anchor="middle">(2, 4)</text>
<text x="680.000" y="275.000" class="" text-anchor="middle">2/5</text>
<text x="870.000" y="275.000" class="" text-anchor="middle">2/5</text>
<line x1="45.000" y1="316.000" x2="955.000" y2="316.000" stroke="#ecedef" stroke-width="1.3"/>
<text x="90.000" y="364.000" class="small" text-anchor="start">加权输出</text>
<text x="680.000" y="364.000" class="" text-anchor="middle">(8/5, 12/5)</text>
<text x="870.000" y="364.000" class="" text-anchor="middle">(6/5, 16/5)</text>
<text x="500.000" y="418.000" class="small" text-anchor="middle">两个查询分别偏向不同坐标；相同 V 按不同权重组合</text>
</svg>