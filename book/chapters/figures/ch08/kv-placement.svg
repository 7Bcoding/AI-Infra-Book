<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="318" viewBox="0 0 1000 318" role="img" aria-labelledby="title desc">
<title id="title">同一份历史经过两种接口</title><desc id="desc">两种放置各读一次相同的 16 GiB，右侧按同一毫秒刻度比较接口时间。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="25.000" y="43.000" class="" text-anchor="start">同一份 16 GiB 历史</text>
<text x="548.000" y="43.000" class="" text-anchor="start">一遍读完所需的时间</text>
<text x="25.000" y="118.000" class="" text-anchor="start">GPU 显存</text>
<line x1="150.000" y1="111.000" x2="322.000" y2="111.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="232.000" y="99.000" class="small" text-anchor="middle" style="fill:#25333b">HBM</text>
<text x="232.000" y="139.000" class="small" text-anchor="middle" style="fill:#25333b">3 TB/s</text>
<text x="339.000" y="118.000" class="" text-anchor="start">计算单元</text>
<line x1="548.000" y1="111.000" x2="551.954" y2="111.000" stroke="#38677f" stroke-width="7"/>
<circle cx="551.954" cy="111.000" r="5" fill="#38677f"/>
<text x="565.000" y="95.000" class="" text-anchor="start" style="fill:#38677f">5.73 ms</text>
<text x="25.000" y="221.000" class="" text-anchor="start">主机内存</text>
<line x1="150.000" y1="214.000" x2="322.000" y2="214.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="232.000" y="202.000" class="small" text-anchor="middle" style="fill:#25333b">主机链路</text>
<text x="232.000" y="242.000" class="small" text-anchor="middle" style="fill:#25333b">32 GB/s</text>
<text x="339.000" y="221.000" class="" text-anchor="start">GPU 缓冲</text>
<line x1="548.000" y1="214.000" x2="918.440" y2="214.000" stroke="#a45b3e" stroke-width="7"/>
<circle cx="918.440" cy="214.000" r="5" fill="#a45b3e"/>
<text x="914.440" y="198.000" class="" text-anchor="end" style="fill:#a45b3e">537 ms</text>
<line x1="548.000" y1="262.000" x2="932.000" y2="262.000" stroke="#66727b" stroke-width="1.3"/>
<line x1="548.000" y1="257.000" x2="548.000" y2="268.000" stroke="#66727b" stroke-width="1.3"/>
<text x="548.000" y="294.000" class="small" text-anchor="middle" style="fill:#25333b">0</text>
<line x1="720.500" y1="257.000" x2="720.500" y2="268.000" stroke="#66727b" stroke-width="1.3"/>
<text x="720.500" y="294.000" class="small" text-anchor="middle" style="fill:#25333b">250</text>
<line x1="893.000" y1="257.000" x2="893.000" y2="268.000" stroke="#66727b" stroke-width="1.3"/>
<text x="893.000" y="294.000" class="small" text-anchor="middle" style="fill:#25333b">500</text>
<text x="943.000" y="294.000" class="small" text-anchor="start">ms</text>
</svg>
