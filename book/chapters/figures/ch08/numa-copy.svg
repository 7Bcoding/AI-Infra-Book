<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="277" viewBox="0 0 1000 277" role="img" aria-labelledby="title desc">
<title id="title">主机页的位置怎样改变复制路径</title><desc id="desc">两份 64 MiB 输入到同一张 GPU，远端页先经过插槽间互连，再走相同的 PCIe 根端口。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="26.000" y="43.000" class="" text-anchor="start">输入页的位置</text>
<text x="473.000" y="43.000" class="" text-anchor="middle" style="fill:#25333b">同一台双插槽服务器</text>
<text x="884.000" y="43.000" class="" text-anchor="middle" style="fill:#25333b">传完 64 MiB</text>
<text x="26.000" y="125.000" class="" text-anchor="start">节点 0 的内存</text>
<line x1="187.000" y1="118.000" x2="395.000" y2="118.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="414.000" y="93.000" width="152.000" height="50.000" fill="#ecedef" stroke="#aeb9bf" stroke-width="1"/>
<text x="490.000" y="125.000" class="" text-anchor="middle" style="fill:#25333b">根端口 0</text>
<line x1="573.000" y1="118.000" x2="654.000" y2="118.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="616.000" y="105.000" class="small" text-anchor="middle" style="fill:#25333b">PCIe</text>
<rect x="667.000" y="93.000" width="82.000" height="50.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="708.000" y="125.000" class="" text-anchor="middle" style="fill:#25333b">GPU</text>
<text x="884.000" y="115.000" class="" text-anchor="middle" style="fill:#25333b">2.80 ms</text>
<text x="884.000" y="145.000" class="small" text-anchor="middle" style="fill:#25333b">24 GB/s</text>
<text x="26.000" y="229.000" class="" text-anchor="start">节点 1 的内存</text>
<line x1="187.000" y1="222.000" x2="395.000" y2="222.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="288.000" y="209.000" class="small" text-anchor="middle" style="fill:#25333b">经插槽间互连</text>
<rect x="414.000" y="197.000" width="152.000" height="50.000" fill="#ecedef" stroke="#aeb9bf" stroke-width="1"/>
<text x="490.000" y="229.000" class="" text-anchor="middle" style="fill:#25333b">根端口 0</text>
<line x1="573.000" y1="222.000" x2="654.000" y2="222.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="616.000" y="209.000" class="small" text-anchor="middle" style="fill:#25333b">PCIe</text>
<rect x="667.000" y="197.000" width="82.000" height="50.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="708.000" y="229.000" class="" text-anchor="middle" style="fill:#25333b">GPU</text>
<text x="884.000" y="219.000" class="" text-anchor="middle" style="fill:#25333b">5.59 ms</text>
<text x="884.000" y="249.000" class="small" text-anchor="middle" style="fill:#25333b">12 GB/s</text>
</svg>
