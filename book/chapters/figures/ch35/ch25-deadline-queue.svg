<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="371" viewBox="0 0 1000 371" role="img" aria-labelledby="title desc">
<title id="title">同一模型的四个请求</title><desc id="desc">同一模型的四个请求</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="36.000" y="85.000" class="small" text-anchor="start">请求 1</text>
<rect x="155.000" y="65.000" width="192.000" height="26.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<line x1="395.000" y1="60.000" x2="395.000" y2="96.000" stroke="#a45b3e" stroke-width="2.4"/>
<text x="36.000" y="140.000" class="small" text-anchor="start">请求 2</text>
<rect x="315.000" y="120.000" width="32.000" height="26.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<rect x="347.000" y="120.000" width="192.000" height="26.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<line x1="555.000" y1="115.000" x2="555.000" y2="151.000" stroke="#a45b3e" stroke-width="2.4"/>
<text x="36.000" y="195.000" class="small" text-anchor="start">请求 3</text>
<rect x="475.000" y="175.000" width="64.000" height="26.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<rect x="539.000" y="175.000" width="192.000" height="26.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<line x1="715.000" y1="170.000" x2="715.000" y2="206.000" stroke="#a45b3e" stroke-width="2.4"/>
<text x="36.000" y="250.000" class="small" text-anchor="start">请求 4</text>
<rect x="635.000" y="230.000" width="96.000" height="26.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<rect x="731.000" y="230.000" width="192.000" height="26.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<line x1="875.000" y1="225.000" x2="875.000" y2="261.000" stroke="#a45b3e" stroke-width="2.4"/>
<text x="155.000" y="306.000" class="small" text-anchor="middle" style="fill:#25333b">0</text>
<text x="315.000" y="306.000" class="small" text-anchor="middle" style="fill:#25333b">20</text>
<text x="475.000" y="306.000" class="small" text-anchor="middle" style="fill:#25333b">40</text>
<text x="635.000" y="306.000" class="small" text-anchor="middle" style="fill:#25333b">60</text>
<text x="795.000" y="306.000" class="small" text-anchor="middle" style="fill:#25333b">80</text>
<text x="955.000" y="306.000" class="small" text-anchor="middle" style="fill:#25333b">100</text>
<text x="500.000" y="348.000" class="small" text-anchor="middle" style="fill:#25333b">横轴为毫秒。暖色为排队，冷色为执行，每条竖线是该请求的最晚完成时刻。</text>
</svg>
