<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">单条 InfiniBand rail 的收敛与双 rail 的分配</title><desc id="desc">每架两台服务器的 0 号口共用一条 40 GB/s 上行，双 rail 对齐后，两条 rail 各送 1 GiB。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:22px;fill:#25333b}.s{font-size:19px}.t{font-size:18px}</style>
<rect width="100%" height="100%" fill="#fff"/>
<text x="130" y="35" class="" text-anchor="middle">机架甲</text>
<text x="865" y="35" class="" text-anchor="middle">机架乙</text>
<text x="500" y="35" class="s" text-anchor="middle">rail 0 的物理路径</text>
<rect x="30" y="74" width="155" height="43" fill="#e6edf0" stroke="#586c78"/>
<text x="107.5" y="103" class="s" text-anchor="middle">甲一 · 0 号口</text>
<line x1="185" y1="95" x2="258" y2="128" stroke="#526572" stroke-width="2" stroke-dasharray=""/>
<rect x="30" y="139" width="155" height="43" fill="#e6edf0" stroke="#586c78"/>
<text x="107.5" y="168" class="s" text-anchor="middle">甲二 · 0 号口</text>
<line x1="185" y1="160" x2="258" y2="128" stroke="#526572" stroke-width="2" stroke-dasharray=""/>
<rect x="258" y="106" width="103" height="44" fill="#f1f3f4" stroke="#586c78"/>
<text x="309.5" y="136" class="s" text-anchor="middle">叶交换机</text>
<rect x="815" y="74" width="155" height="43" fill="#e6edf0" stroke="#586c78"/>
<text x="892.5" y="103" class="s" text-anchor="middle">乙一 · 0 号口</text>
<line x1="815" y1="95" x2="740" y2="128" stroke="#526572" stroke-width="2" stroke-dasharray=""/>
<rect x="815" y="139" width="155" height="43" fill="#e6edf0" stroke="#586c78"/>
<text x="892.5" y="168" class="s" text-anchor="middle">乙二 · 0 号口</text>
<line x1="815" y1="160" x2="740" y2="128" stroke="#526572" stroke-width="2" stroke-dasharray=""/>
<rect x="637" y="106" width="103" height="44" fill="#f1f3f4" stroke="#586c78"/>
<text x="688.5" y="136" class="s" text-anchor="middle">叶交换机</text>
<line x1="361" y1="128" x2="452" y2="128" stroke="#91573c" stroke-width="3" stroke-dasharray=""/>
<line x1="548" y1="128" x2="637" y2="128" stroke="#91573c" stroke-width="3" stroke-dasharray=""/>
<rect x="452" y="106" width="96" height="44" fill="#f1f3f4" stroke="#586c78"/>
<text x="500" y="136" class="s" text-anchor="middle">脊交换机</text>
<text x="405" y="92" class="t" text-anchor="middle">40 GB/s</text>
<text x="596" y="92" class="t" text-anchor="middle">40 GB/s</text>
<line x1="407" y1="102" x2="407" y2="176" stroke="#697881" stroke-width="1.3" stroke-dasharray="5 5"/>
<text x="410" y="200" class="t" text-anchor="middle">机架甲切面</text>
<text x="130" y="212" class="t" text-anchor="middle">每台发 512 MiB</text>
<text x="865" y="212" class="t" text-anchor="middle">每台收 512 MiB</text>
<line x1="42" y1="234" x2="958" y2="234" stroke="#b9c3c8" stroke-width="1" stroke-dasharray=""/>
<text x="38" y="270" class="" text-anchor="start">两条 rail 在同一时段承载的甲 → 乙载荷</text>
<text x="360" y="303" class="s" text-anchor="middle">rail 0</text>
<text x="708" y="303" class="s" text-anchor="middle">rail 1</text>
<text x="40" y="344" class="s" text-anchor="start">同编号对齐</text>
<rect x="225" y="319" width="270" height="30" fill="#fff" stroke="#b7c0c4"/>
<rect x="225" y="319" width="135" height="30" fill="#b7cdd7" stroke="#73848c"/>
<text x="510" y="342" class="s" text-anchor="start">1 GiB</text>
<rect x="590" y="319" width="270" height="30" fill="#fff" stroke="#b7c0c4"/>
<rect x="590" y="319" width="135" height="30" fill="#b7cdd7" stroke="#73848c"/>
<text x="875" y="342" class="s" text-anchor="start">1 GiB</text>
<text x="40" y="398" class="s" text-anchor="start">全走 0 号</text>
<rect x="225" y="373" width="270" height="30" fill="#fff" stroke="#b7c0c4"/>
<rect x="225" y="373" width="270" height="30" fill="#d4a48b" stroke="#73848c"/>
<text x="510" y="396" class="s" text-anchor="start">2 GiB</text>
<rect x="590" y="373" width="270" height="30" fill="#fff" stroke="#b7c0c4"/>
<text x="875" y="396" class="s" text-anchor="start">0</text>
</svg>
