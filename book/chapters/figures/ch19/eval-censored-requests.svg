<text x="350.000" y="453.000" class="small" text-anchor="middle" style="fill:#25333b">20</text>
<line x1="450.000" y1="420.000" x2="450.000" y2="427.000" stroke="#66727b" stroke-width="1.3"/>
<text x="450.000" y="453.000" class="small" text-anchor="middle" style="fill:#25333b">30</text>
<line x1="550.000" y1="420.000" x2="550.000" y2="427.000" stroke="#66727b" stroke-width="1.3"/>
