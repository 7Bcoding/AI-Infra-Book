<line x1="870.000" y1="420.000" x2="870.000" y2="427.000" stroke="#66727b" stroke-width="1.3"/>
<text x="870.000" y="453.000" class="small" text-anchor="middle" style="fill:#25333b">72</text>
<text x="75.000" y="502.000" class="small" text-anchor="start">到达批次：6 条；时限 20 ms；达标 5 条，不能丢掉最后一条。</text>
