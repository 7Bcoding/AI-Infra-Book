<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="278" viewBox="0 0 1000 278" role="img" aria-labelledby="title desc">
<title id="title">异构适配器批的两行投影</title><desc id="desc">两行共用基础计算，各自的小矩阵修正不同的分量。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="75.000" y="42.000" class="" text-anchor="middle" style="fill:#25333b">请求</text>
<text x="244.000" y="42.000" class="" text-anchor="middle" style="fill:#25333b">公共项 xW</text>
<text x="455.000" y="42.000" class="" text-anchor="middle" style="fill:#25333b">旁路 xA</text>
<text x="653.000" y="42.000" class="" text-anchor="middle" style="fill:#25333b">修正 (xA)B</text>
<text x="866.000" y="42.000" class="" text-anchor="middle" style="fill:#25333b">最终输出</text>
<line x1="27.000" y1="63.000" x2="971.000" y2="63.000" stroke="#aeb9bf" stroke-width="1.3"/>
<text x="75.000" y="118.000" class="" text-anchor="middle" style="fill:#25333b">甲</text>
<text x="244.000" y="118.000" class="" text-anchor="middle" style="fill:#38677f">(1, 2)</text>
<text x="455.000" y="118.000" class="" text-anchor="middle" style="fill:#25333b">1</text>
<text x="653.000" y="118.000" class="" text-anchor="middle" style="fill:#a45b3e">(0, 2)</text>
<text x="866.000" y="118.000" class="" text-anchor="middle" style="fill:#25333b">(1, 4)</text>
<line x1="495.000" y1="111.000" x2="573.000" y2="111.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="75.000" y="192.000" class="" text-anchor="middle" style="fill:#25333b">乙</text>
<text x="244.000" y="192.000" class="" text-anchor="middle" style="fill:#38677f">(1, 2)</text>
<text x="455.000" y="192.000" class="" text-anchor="middle" style="fill:#25333b">2</text>
<text x="653.000" y="192.000" class="" text-anchor="middle" style="fill:#a45b3e">(2, 0)</text>
<text x="866.000" y="192.000" class="" text-anchor="middle" style="fill:#25333b">(3, 2)</text>
<line x1="495.000" y1="185.000" x2="573.000" y2="185.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="28.000" y1="221.000" x2="971.000" y2="221.000" stroke="#aeb9bf" stroke-width="1.3"/>
<text x="509.000" y="255.000" class="small" text-anchor="middle" style="fill:#25333b">最终输出取同行的公共项与修正之和。</text>
</svg>
