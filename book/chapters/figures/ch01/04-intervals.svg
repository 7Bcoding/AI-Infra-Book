<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
<title id="title">相同平均速度下不同的输出停顿</title><desc id="desc">两条时间线都从0.60秒输出到1.00秒，下面一条在0.70到0.90秒间停顿。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="35.000" y="35.000" class="" text-anchor="start">两条请求：首 token 相同，末 token 相同</text>
<text x="35.000" y="96.000" class="small" text-anchor="start">均匀输出</text>
<line x1="160.000" y1="90.000" x2="870.000" y2="90.000" stroke="#66727b" stroke-width="1.3"/>
<circle cx="160.000" cy="90.000" r="5" fill="#38677f"/>
<circle cx="238.889" cy="90.000" r="5" fill="#38677f"/>
<circle cx="317.778" cy="90.000" r="5" fill="#38677f"/>
<circle cx="396.667" cy="90.000" r="5" fill="#38677f"/>
<circle cx="475.556" cy="90.000" r="5" fill="#38677f"/>
<circle cx="554.444" cy="90.000" r="5" fill="#38677f"/>
<circle cx="633.333" cy="90.000" r="5" fill="#38677f"/>
<circle cx="712.222" cy="90.000" r="5" fill="#38677f"/>
<circle cx="791.111" cy="90.000" r="5" fill="#38677f"/>
<circle cx="870.000" cy="90.000" r="5" fill="#38677f"/>
<text x="35.000" y="186.000" class="small" text-anchor="start">中间停顿</text>
<line x1="160.000" y1="180.000" x2="870.000" y2="180.000" stroke="#66727b" stroke-width="1.3"/>
<circle cx="160.000" cy="180.000" r="5" fill="#a45b3e"/>
<circle cx="204.375" cy="180.000" r="5" fill="#a45b3e"/>
<circle cx="248.750" cy="180.000" r="5" fill="#a45b3e"/>
<circle cx="293.125" cy="180.000" r="5" fill="#a45b3e"/>
<circle cx="337.500" cy="180.000" r="5" fill="#a45b3e"/>
<circle cx="692.500" cy="180.000" r="5" fill="#a45b3e"/>
<circle cx="736.875" cy="180.000" r="5" fill="#a45b3e"/>
<circle cx="781.250" cy="180.000" r="5" fill="#a45b3e"/>
<circle cx="825.625" cy="180.000" r="5" fill="#a45b3e"/>
<circle cx="870.000" cy="180.000" r="5" fill="#a45b3e"/>
<line x1="337.500" y1="211.000" x2="692.500" y2="211.000" stroke="#a45b3e" stroke-width="1.3"/>
<line x1="337.500" y1="206.000" x2="337.500" y2="216.000" stroke="#a45b3e" stroke-width="1.3"/>
<line x1="692.500" y1="206.000" x2="692.500" y2="216.000" stroke="#a45b3e" stroke-width="1.3"/>
<text x="515.000" y="237.000" class="small" text-anchor="middle" style="fill:#a45b3e">200 毫秒没有新输出</text>
<line x1="160.000" y1="252.000" x2="160.000" y2="258.000" stroke="#66727b" stroke-width="1.3"/>
<text x="160.000" y="282.000" class="small" text-anchor="middle">0.60</text>
<line x1="337.500" y1="252.000" x2="337.500" y2="258.000" stroke="#66727b" stroke-width="1.3"/>
<text x="337.500" y="282.000" class="small" text-anchor="middle">0.70</text>
<line x1="515.000" y1="252.000" x2="515.000" y2="258.000" stroke="#66727b" stroke-width="1.3"/>
<text x="515.000" y="282.000" class="small" text-anchor="middle">0.80</text>
<line x1="692.500" y1="252.000" x2="692.500" y2="258.000" stroke="#66727b" stroke-width="1.3"/>
<text x="692.500" y="282.000" class="small" text-anchor="middle">0.90</text>
<line x1="870.000" y1="252.000" x2="870.000" y2="258.000" stroke="#66727b" stroke-width="1.3"/>
<text x="870.000" y="282.000" class="small" text-anchor="middle">1.00</text>
<text x="921.000" y="282.000" class="small" text-anchor="start">秒</text>
<text x="520.000" y="140.000" class="small" text-anchor="middle">两者平均间隔均为 0.40 ÷ 9 ≈ 44.4 毫秒</text>
</svg>