<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">按阶段和按层分离的载荷</title><desc id="desc">一次发送历史或逐层往返隐藏行</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="500.000" y="37.000" class="" text-anchor="middle" style="fill:#25333b">阶段分离 · 一条请求，1024 个已知位置</text>
<rect x="135.000" y="61.000" width="173.000" height="46.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="221.500" y="91.000" class="" text-anchor="middle" style="fill:#25333b">预填充 P</text>
<rect x="706.000" y="61.000" width="162.000" height="46.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="787.000" y="91.000" class="" text-anchor="middle" style="fill:#25333b">解码 D</text>
<line x1="313.000" y1="84.000" x2="700.000" y2="84.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="506.000" y="73.000" class="small" text-anchor="middle" style="fill:#25333b">历史 KV · 128 MiB</text>
<line x1="61.000" y1="139.000" x2="933.000" y2="139.000" stroke="#aeb9bf" stroke-width="1"/>
<text x="500.000" y="184.000" class="" text-anchor="middle" style="fill:#25333b">注意力与 FFN 分离 · 64 个解码行</text>
<rect x="44.000" y="224.000" width="145.000" height="47.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="116.500" y="254.500" class="" text-anchor="middle" style="fill:#25333b">注意力 1</text>
<line x1="192.000" y1="247.000" x2="226.000" y2="247.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="228.000" y="224.000" width="145.000" height="47.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="300.500" y="254.500" class="" text-anchor="middle" style="fill:#25333b">FFN 1</text>
<line x1="376.000" y1="247.000" x2="410.000" y2="247.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="414.000" y="224.000" width="145.000" height="47.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="486.500" y="254.500" class="" text-anchor="middle" style="fill:#25333b">注意力 2</text>
<line x1="562.000" y1="247.000" x2="596.000" y2="247.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="600.000" y="224.000" width="145.000" height="47.000" fill="#efe0d5" stroke="#aeb9bf" stroke-width="1"/>
<text x="672.500" y="254.500" class="" text-anchor="middle" style="fill:#25333b">FFN 2</text>
<line x1="748.000" y1="247.000" x2="782.000" y2="247.000" stroke="#66727b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="786.000" y="224.000" width="145.000" height="47.000" fill="#dce7ed" stroke="#aeb9bf" stroke-width="1"/>
<text x="858.500" y="254.500" class="" text-anchor="middle" style="fill:#25333b">注意力 3</text>
<text x="494.000" y="315.000" class="small" text-anchor="middle" style="fill:#25333b">每个箭头搬 512 KiB 隐藏表示；32 层共搬 32 MiB。</text>
</svg>
