<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="495" viewBox="0 0 1000 495" role="img" aria-labelledby="title desc">
<title id="title">注意力输出是值向量的凸组合</title><desc id="desc">三个真实值向量构成三角形，最后位置输出位于零、二分之一。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<line x1="102.000" y1="265.000" x2="613.500" y2="265.000" stroke="#ecedef" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="350.000" y1="435.500" x2="350.000" y2="48.000" stroke="#ecedef" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="613.500" y="292.000" class="small" text-anchor="end">第 0 分量</text>
<text x="362.000" y="48.000" class="small" text-anchor="start">第 1 分量</text>
<polygon points="505.0,110.0 505.0,420.0 195.0,110.0 505.0,110.0" fill="#dce7ed" fill-opacity=".55" stroke="#38677f" stroke-width="1.6"/>
<circle cx="505.000" cy="110.000" r="6" fill="#38677f"/>
<text x="520.000" y="97.000" class="small" text-anchor="start">v₀ = (1, 1)</text>
<circle cx="505.000" cy="420.000" r="6" fill="#38677f"/>
<text x="520.000" y="448.000" class="small" text-anchor="start">v₁ = (1, −1)</text>
<circle cx="195.000" cy="110.000" r="6" fill="#38677f"/>
<text x="183.000" y="97.000" class="small" text-anchor="end">v₂ = (−1, 1)</text>
<circle cx="350.000" cy="187.500" r="7" fill="#a45b3e"/>
<line x1="360.000" y1="187.500" x2="665.000" y2="187.500" stroke="#a45b3e" stroke-width="1.3"/>
<text x="690.000" y="180.000" class="" text-anchor="start" style="fill:#a45b3e">o₂ = (0, 1/2)</text>
<text x="690.000" y="260.000" class="" text-anchor="start">1/4 × v₀</text>
<text x="690.000" y="302.000" class="" text-anchor="start">1/4 × v₁</text>
<text x="690.000" y="344.000" class="" text-anchor="start">1/2 × v₂</text>
<text x="500.000" y="474.000" class="small" text-anchor="middle">第一分量：1/4 + 1/4 − 1/2 = 0；第二分量：1/4 − 1/4 + 1/2 = 1/2</text>
</svg>