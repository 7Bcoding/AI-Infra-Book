<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">注意力权重与分数的局部梯度</title><desc id="desc">输出上游梯度为一零，值的第一分量提供权重梯度，再经softmax得到分数梯度。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="500.000" y="35.000" class="" text-anchor="middle">只检查注意力这一段：上游梯度 g = (1, 0)</text>
<text x="180.000" y="96.000" class="small" text-anchor="middle">权重 a</text>
<text x="400.000" y="96.000" class="small" text-anchor="middle">权重梯度 ā</text>
<text x="630.000" y="96.000" class="small" text-anchor="middle">减去加权均值</text>
<text x="855.000" y="96.000" class="small" text-anchor="middle">分数梯度 s̄</text>
<text x="40.000" y="158.000" class="small" text-anchor="start">键 0</text>
<text x="180.000" y="158.000" class="" text-anchor="middle">1/4</text>
<text x="400.000" y="158.000" class="" text-anchor="middle">1</text>
<text x="630.000" y="158.000" class="" text-anchor="middle">1 − 0</text>
<rect x="790.000" y="120.000" width="130.000" height="57.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="855.000" y="158.000" class="" text-anchor="middle">1/4</text>
<text x="40.000" y="230.000" class="small" text-anchor="start">键 1</text>
<text x="180.000" y="230.000" class="" text-anchor="middle">1/4</text>
<text x="400.000" y="230.000" class="" text-anchor="middle">1</text>
<text x="630.000" y="230.000" class="" text-anchor="middle">1 − 0</text>
<rect x="790.000" y="192.000" width="130.000" height="57.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="855.000" y="230.000" class="" text-anchor="middle">1/4</text>
<text x="40.000" y="302.000" class="small" text-anchor="start">键 2</text>
<text x="180.000" y="302.000" class="" text-anchor="middle">1/2</text>
<text x="400.000" y="302.000" class="" text-anchor="middle">−1</text>
<text x="630.000" y="302.000" class="" text-anchor="middle">−1 − 0</text>
<rect x="790.000" y="264.000" width="130.000" height="57.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="855.000" y="302.000" class="" text-anchor="middle">−1/2</text>
<line x1="515.000" y1="115.000" x2="515.000" y2="323.000" stroke="#ecedef" stroke-width="1.3"/>
<line x1="740.000" y1="115.000" x2="740.000" y2="323.000" stroke="#ecedef" stroke-width="1.3"/>
<text x="500.000" y="373.000" class="small" text-anchor="middle">āⱼ = g · vⱼ；加权均值 = 1/4 × 1 + 1/4 × 1 + 1/2 × (−1) = 0</text>
<text x="500.000" y="419.000" class="small" text-anchor="middle">最后一列 = 第一列 × 第三列；分数梯度相加为零</text>
</svg>