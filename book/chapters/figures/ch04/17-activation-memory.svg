<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">单层中间张量的真实容量比例</title><desc id="desc">4096位置、宽度4096、32查询头、前馈宽度11008，每元素2字节。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="500.000" y="33.000" class="" text-anchor="middle">同一层，T = 4096，每元素 2 字节</text>
<text x="215.000" y="126.000" class="small" text-anchor="end">一份残差表示</text>
<rect x="240.000" y="95.000" width="17.812" height="43.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="272.812" y="125.000" class="small" text-anchor="start">32 MiB</text>
<text x="215.000" y="214.000" class="small" text-anchor="end">一份前馈展开</text>
<rect x="240.000" y="183.000" width="47.871" height="43.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="302.871" y="213.000" class="small" text-anchor="start">86 MiB</text>
<text x="215.000" y="302.000" class="small" text-anchor="end">完整注意力方阵</text>
<rect x="240.000" y="271.000" width="570.000" height="43.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="825.000" y="301.000" class="small" text-anchor="start">1024 MiB</text>
<text x="500.000" y="366.000" class="small" text-anchor="middle">第三条是显式保存 Hq × T × T 方阵的容量</text>
<text x="500.000" y="402.000" class="small" text-anchor="middle">分块与重算可以改变保存方式；数学定义不强制同时存下整个方阵</text>
</svg>