<line x1="130.000" y1="171.000" x2="130.000" y2="185.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="93.000" y="202.000" width="74.000" height="42.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="130.000" y="230.000" class="small" text-anchor="middle">表示</text>
<line x1="130.000" y1="259.000" x2="130.000" y2="277.000" stroke="#66727b" stroke-width="1.3"/>
<line x1="130.000" y1="313.000" x2="130.000" y2="332.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="130.000" y="363.000" class="small" text-anchor="middle">分布</text>
<line x1="130.000" y1="380.000" x2="130.000" y2="406.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="130.000" y="435.000" class="small" text-anchor="middle">交叉熵</text>
<line x1="130.000" y1="461.000" x2="130.000" y2="445.000" stroke="#a45b3e" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="260.000" y="105.000" class="" text-anchor="middle">爱</text>
<line x1="260.000" y1="123.000" x2="260.000" y2="140.000" stroke="#66727b" stroke-width="1.3"/>
<line x1="260.000" y1="171.000" x2="260.000" y2="185.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="223.000" y="202.000" width="74.000" height="42.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="260.000" y="230.000" class="small" text-anchor="middle">表示</text>
<line x1="260.000" y1="259.000" x2="260.000" y2="277.000" stroke="#66727b" stroke-width="1.3"/>
<line x1="260.000" y1="313.000" x2="260.000" y2="332.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="260.000" y="363.000" class="small" text-anchor="middle">分布</text>
<line x1="260.000" y1="380.000" x2="260.000" y2="406.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="260.000" y="435.000" class="small" text-anchor="middle">交叉熵</text>
<line x1="260.000" y1="461.000" x2="260.000" y2="445.000" stroke="#a45b3e" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="390.000" y="105.000" class="" text-anchor="middle">你</text>
<line x1="390.000" y1="123.000" x2="390.000" y2="140.000" stroke="#66727b" stroke-width="1.3"/>
<line x1="390.000" y1="171.000" x2="390.000" y2="185.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="353.000" y="202.000" width="74.000" height="42.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="390.000" y="230.000" class="small" text-anchor="middle">表示</text>
<line x1="390.000" y1="259.000" x2="390.000" y2="277.000" stroke="#66727b" stroke-width="1.3"/>
<line x1="390.000" y1="313.000" x2="390.000" y2="332.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="390.000" y="363.000" class="small" text-anchor="middle">分布</text>
<line x1="390.000" y1="380.000" x2="390.000" y2="406.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="390.000" y="435.000" class="small" text-anchor="middle">交叉熵</text>
<line x1="390.000" y1="461.000" x2="390.000" y2="445.000" stroke="#a45b3e" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="130.000" y="485.000" class="small" text-anchor="middle" style="fill:#a45b3e">目标：爱</text>
<text x="260.000" y="485.000" class="small" text-anchor="middle" style="fill:#a45b3e">目标：你</text>
<text x="390.000" y="485.000" class="small" text-anchor="middle" style="fill:#a45b3e">目标：结束</text>
<text x="245.000" y="164.000" class="small" text-anchor="middle">同一层按掩码交换信息</text>
<text x="245.000" y="303.000" class="small" text-anchor="middle">逐层推进，再得到词表分布</text>
<text x="245.000" y="514.000" class="small" text-anchor="middle">输入已知 ≠ 可以读取未来</text>
<text x="625.000" y="105.000" class="small" text-anchor="middle">已知：我、爱</text>
<text x="845.000" y="105.000" class="small" text-anchor="middle" style="fill:#66727b">未来：？</text>
<line x1="625.000" y1="125.000" x2="625.000" y2="181.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="625.000" y="218.000" class="small" text-anchor="middle">计算分布</text>
<line x1="625.000" y1="237.000" x2="625.000" y2="285.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="625.000" y="320.000" class="small" text-anchor="middle" style="fill:#a45b3e">选出“你”</text>
<line x1="697.000" y1="314.000" x2="846.000" y2="314.000" stroke="#a45b3e" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="845.000" y="286.000" class="small" text-anchor="middle">下一步输入</text>
<line x1="846.000" y1="332.000" x2="846.000" y2="396.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="845.000" y="432.000" class="small" text-anchor="middle">再计算分布</text>
<text x="752.000" y="514.000" class="small" text-anchor="middle">未选择词元，就不能确定下一步输入</text>
</svg>