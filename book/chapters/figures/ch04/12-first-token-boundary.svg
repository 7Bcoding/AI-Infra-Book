<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">首个输出与缓存建立的边界</title><desc id="desc">模型读完“我爱”后选出“你”。把“你”送回模型，缓存才增加第三行，这时模型选出结束符。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="500.000" y="35.000" class="" text-anchor="middle">时间向右推进；长度只表示事件顺序，不代表耗时比例</text>
<line x1="160.000" y1="91.000" x2="945.000" y2="91.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<circle cx="260.000" cy="91.000" r="5" fill="#38677f"/>
<text x="260.000" y="66.000" class="small" text-anchor="middle">预填充完成</text>
<circle cx="570.000" cy="91.000" r="5" fill="#38677f"/>
<text x="570.000" y="66.000" class="small" text-anchor="middle">选出第 1 项</text>
<circle cx="850.000" cy="91.000" r="5" fill="#38677f"/>
<text x="850.000" y="66.000" class="small" text-anchor="middle">解码一次并选出第 2 项</text>
<text x="30.000" y="177.000" class="small" text-anchor="start">已处理输入</text>
<text x="30.000" y="287.000" class="small" text-anchor="start">当前缓存</text>
<text x="30.000" y="393.000" class="small" text-anchor="start">刚选出的词元</text>
<text x="260.000" y="177.000" class="" text-anchor="middle">我、爱</text>
<rect x="206.000" y="238.000" width="54.000" height="61.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<rect x="260.000" y="238.000" width="54.000" height="61.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="260.000" y="331.000" class="small" text-anchor="middle">2 个位置的 K、V</text>
<text x="260.000" y="393.000" class="" text-anchor="middle" style="fill:#a45b3e">尚未选择</text>
<text x="570.000" y="177.000" class="" text-anchor="middle">我、爱</text>
<rect x="516.000" y="238.000" width="54.000" height="61.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<rect x="570.000" y="238.000" width="54.000" height="61.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<text x="570.000" y="331.000" class="small" text-anchor="middle">2 个位置的 K、V</text>
<text x="570.000" y="393.000" class="" text-anchor="middle" style="fill:#a45b3e">你</text>
<text x="850.000" y="177.000" class="" text-anchor="middle">我、爱、你</text>
<rect x="769.000" y="238.000" width="54.000" height="61.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<rect x="823.000" y="238.000" width="54.000" height="61.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
<rect x="877.000" y="238.000" width="54.000" height="61.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="850.000" y="331.000" class="small" text-anchor="middle">3 个位置的 K、V</text>
<text x="850.000" y="393.000" class="" text-anchor="middle" style="fill:#a45b3e">&lt;eos&gt;</text>
<line x1="618.000" y1="383.000" x2="772.000" y2="195.000" stroke="#a45b3e" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="699.000" y="232.000" class="small" text-anchor="middle">送回模型</text>
<text x="500.000" y="470.000" class="small" text-anchor="middle">“你”在中间时刻已经可返回给用户，但要到右侧执行时才写入缓存</text>
</svg>
