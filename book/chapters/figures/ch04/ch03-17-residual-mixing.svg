<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc">
<title id="title">残差混合的共同与差异方向</title><desc id="desc">上下两路的平均保持，两路差逐层变小。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<line x1="135.000" y1="252.000" x2="875.000" y2="252.000" stroke="#aeb9bf" stroke-width="1" stroke-dasharray="5 5"/>
<text x="101.000" y="258.000" class="small" text-anchor="middle" style="fill:#25333b">1</text>
<line x1="135.000" y1="164.000" x2="875.000" y2="164.000" stroke="#aeb9bf" stroke-width="1" stroke-dasharray="5 5"/>
<text x="101.000" y="170.000" class="small" text-anchor="middle" style="fill:#25333b">2</text>
<line x1="135.000" y1="76.000" x2="875.000" y2="76.000" stroke="#aeb9bf" stroke-width="1" stroke-dasharray="5 5"/>
<text x="101.000" y="82.000" class="small" text-anchor="middle" style="fill:#25333b">3</text>
<text x="86.000" y="36.000" class="" text-anchor="start">支路数值</text>
<polyline points="180.000,76.000 395.000,120.000 610.000,142.000 825.000,153.000" fill="none" stroke="#38677f" stroke-width="2"/>
<circle cx="180.000" cy="76.000" r="5" fill="#38677f"/>
<circle cx="395.000" cy="120.000" r="5" fill="#38677f"/>
<circle cx="610.000" cy="142.000" r="5" fill="#38677f"/>
<circle cx="825.000" cy="153.000" r="5" fill="#38677f"/>
<polyline points="180.000,252.000 395.000,208.000 610.000,186.000 825.000,175.000" fill="none" stroke="#a45b3e" stroke-width="2"/>
<circle cx="180.000" cy="252.000" r="5" fill="#a45b3e"/>
<circle cx="395.000" cy="208.000" r="5" fill="#a45b3e"/>
<circle cx="610.000" cy="186.000" r="5" fill="#a45b3e"/>
<circle cx="825.000" cy="175.000" r="5" fill="#a45b3e"/>
<text x="180.000" y="328.000" class="small" text-anchor="middle" style="fill:#25333b">边界 0</text>
<text x="395.000" y="328.000" class="small" text-anchor="middle" style="fill:#25333b">边界 1</text>
<text x="610.000" y="328.000" class="small" text-anchor="middle" style="fill:#25333b">边界 2</text>
<text x="825.000" y="328.000" class="small" text-anchor="middle" style="fill:#25333b">边界 3</text>
<text x="201.000" y="72.000" class="small" text-anchor="start" style="fill:#38677f">第一路</text>
<text x="199.000" y="280.000" class="small" text-anchor="start" style="fill:#a45b3e">第二路</text>
<text x="507.000" y="378.000" class="small" text-anchor="middle" style="fill:#25333b">两路平均值恒为 2，每混合一次，差值减半。</text>
