<text x="545.000" y="200.000" class="" text-anchor="middle">我、爱</text>
<line x1="545.000" y1="220.000" x2="545.000" y2="295.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="559.000" y="264.000" class="small" text-anchor="start">预测下一项</text>
<rect x="467.000" y="307.000" width="156.000" height="56.000" fill="#efe0d5" stroke="#25333b" stroke-width="1"/>
<text x="545.000" y="343.000" class="" text-anchor="middle">茶</text>
<line x1="545.000" y1="129.000" x2="545.000" y2="172.000" stroke="#38677f" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="795.000" y="39.000" class="" text-anchor="middle">位置 2</text>
<rect x="717.000" y="65.000" width="156.000" height="56.000" fill="#dce7ed" stroke="#25333b" stroke-width="1"/>
