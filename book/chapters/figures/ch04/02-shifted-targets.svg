<text x="795.000" y="200.000" class="" text-anchor="middle">我、爱、茶</text>
<line x1="795.000" y1="220.000" x2="795.000" y2="295.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
