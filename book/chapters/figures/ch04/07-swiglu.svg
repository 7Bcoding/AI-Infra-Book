<text x="225.000" y="184.000" class="" text-anchor="middle" style="fill:#a45b3e">−0.245819</text>
<text x="745.000" y="184.000" class="" text-anchor="middle" style="fill:#38677f">−0.784465</text>
<text x="490.000" y="184.000" class="" text-anchor="middle">0.192836</text>
<line x1="290.000" y1="176.000" x2="410.000" y2="176.000" stroke="#a45b3e" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="662.000" y1="176.000" x2="570.000" y2="176.000" stroke="#38677f" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="490.000" y="144.000" class="small" text-anchor="middle">逐项相乘</text>
