<text x="225.000" y="289.000" class="" text-anchor="middle" style="fill:#a45b3e">0.899412</text>
<text x="745.000" y="289.000" class="" text-anchor="middle" style="fill:#38677f">1.176697</text>
<text x="490.000" y="289.000" class="" text-anchor="middle">1.058335</text>
<line x1="290.000" y1="281.000" x2="410.000" y2="281.000" stroke="#a45b3e" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="662.000" y1="281.000" x2="570.000" y2="281.000" stroke="#38677f" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="490.000" y="249.000" class="small" text-anchor="middle">逐项相乘</text>
<line x1="490.000" y1="309.000" x2="490.000" y2="365.000" stroke="#66727b" stroke-width="1.3" marker-end="url(#arrow)"/>
