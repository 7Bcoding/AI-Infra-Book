<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">两次残差是两次实际的向量相加</title><desc id="desc">本例位置二的输入与注意力输出相加，再与前馈增量相加。</desc>
<style>text{font-family:"Noto Serif CJK SC","SimSun","Songti SC",serif;font-size:21px;fill:#25333b} .small{font-size:18px} .tiny{font-size:16px} .math{font-family:Georgia,"Times New Roman",serif;font-style:italic} .muted{fill:#66727b}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#66727b" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="40.000" y="38.000" class="" text-anchor="start">位置 2：注意力交换位置之间的信息，前馈变换本位置的特征</text>
<text x="130.000" y="98.000" class="small" text-anchor="middle">原输入 x₂</text>
<text x="130.000" y="142.000" class="" text-anchor="middle">(−1, 1)</text>
<text x="500.000" y="98.000" class="small" text-anchor="middle">注意力增量 o₂</text>
<text x="500.000" y="142.000" class="" text-anchor="middle">(0, 0.5)</text>
<text x="865.000" y="98.000" class="small" text-anchor="middle">第一次残差 r₂</text>
<text x="865.000" y="142.000" class="" text-anchor="middle">(−1, 1.5)</text>
<text x="130.000" y="319.000" class="small" text-anchor="middle">第一次残差 r₂</text>
<text x="130.000" y="363.000" class="" text-anchor="middle">(−1, 1.5)</text>
<text x="500.000" y="319.000" class="small" text-anchor="middle">前馈增量</text>
<text x="500.000" y="363.000" class="" text-anchor="middle">(0.096418, 0.529168)</text>
<text x="865.000" y="319.000" class="small" text-anchor="middle">层输出 h₂</text>
<text x="865.000" y="363.000" class="small" text-anchor="middle">(−0.903582, 2.029168)</text>
<text x="310.000" y="136.000" class="" text-anchor="middle">+</text>
<text x="690.000" y="136.000" class="" text-anchor="middle">=</text>
<text x="310.000" y="366.000" class="" text-anchor="middle">+</text>
<text x="690.000" y="366.000" class="" text-anchor="middle">=</text>
<line x1="865.000" y1="168.000" x2="865.000" y2="221.000" stroke="#38677f" stroke-width="1.3"/>
<line x1="865.000" y1="221.000" x2="130.000" y2="221.000" stroke="#38677f" stroke-width="1.3"/>
<line x1="130.000" y1="221.000" x2="130.000" y2="306.000" stroke="#38677f" stroke-width="1.3" marker-end="url(#arrow)"/>
<circle cx="500.000" cy="221.000" r="3" fill="#38677f"/>
<line x1="500.000" y1="221.000" x2="500.000" y2="244.000" stroke="#38677f" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="500.000" y="272.000" class="small" text-anchor="middle">从 r₂ 另取分支：RMSNorm → SwiGLU</text>
<line x1="500.000" y1="280.000" x2="500.000" y2="299.000" stroke="#38677f" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="500.000" y="478.000" class="small" text-anchor="middle">归一化只作用于变换分支，直接相加的残差保持原值</text>
</svg>